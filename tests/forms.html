<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add / edit / upload forms · Bigback</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body { padding-bottom: 24px; }
    td { padding: 4px 8px; border-top: 1px solid var(--line); font-size: .85rem; vertical-align: top; }
    #frames iframe { display: block; box-sizing: content-box; height: 760px; border: 1px solid var(--line); margin: 8px 0; }
  </style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/forms.html
     Loads the real app in phone-width iframes (no token: reads only, never writes) and checks
     the forms the way a phone user meets them. Needs real time for the frames to settle. -->
<main id="view"><p class="muted">Running…</p></main>
<div id="frames"></div>
<img hidden alt="" src="/__smoke/hold">
<script type="module">
const results = [];
const ok = (name, cond, detail = '') => { results.push({ name, ok: !!cond, detail }); if (!cond) console.error(`Test failed: ${name} ${detail}`); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const KEYS = ['bb.timers', 'bb.stopwatch', 'bb.draft:new', 'bb.draft:upload', 'bb.draft:edit:pan-seared-chicken'];
const saved = Object.fromEntries(KEYS.map(k => [k, localStorage.getItem(k)]));

/** Resolve once the routed view has rendered (has children and isn't busy). */
function rendered(frame, ms = 5000) {
  return new Promise(resolve => {
    const t0 = performance.now();
    (function poll() {
      const v = frame.contentDocument?.getElementById('view');
      if ((v && v.children.length && v.getAttribute('aria-busy') !== 'true') || performance.now() - t0 > ms) setTimeout(resolve, 400);
      else setTimeout(poll, 50);
    })();
  });
}
async function load(route, width) {
  const f = document.createElement('iframe');
  f.style.width = `${width}px`;
  f.title = route;
  f.src = '../index.html' + route;
  document.getElementById('frames').append(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await rendered(f);
  return f;
}
const box = el => el.getBoundingClientRect();
const hits = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
const shown = el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';

try {
  /* ---- the kitchen tools never cover the sticky Save button ---- */
  const now = Date.now();
  localStorage.setItem('bb.timers', JSON.stringify([
    { id: 'tf1', label: 'Simmer sauce', seconds: 1500, endAt: now + 1400e3, pausedLeft: null, slug: null, stepId: null, done: false, doneAt: null },
    { id: 'tf2', label: 'Rest the chicken thighs', seconds: 300, endAt: null, pausedLeft: 200e3, slug: null, stepId: null, done: false, doneAt: null },
    { id: 'tf3', label: 'Bake', seconds: 2400, endAt: now + 2000e3, pausedLeft: null, slug: null, stepId: null, done: false, doneAt: null }]));
  localStorage.setItem('bb.stopwatch', JSON.stringify({ running: true, startedAt: now - 65e3, accumulated: 0, laps: [] }));
  for (const [route, sel] of [['#/add/custom', '[data-save]'], ['#/edit/pan-seared-chicken', '[data-save]'], ['#/add/upload', '[data-send]']]) {
    for (const width of [360, 390]) {
      const f = await load(route, width), d = f.contentDocument;
      const btn = d.querySelector(sel), nav = d.querySelector('.bottomnav');
      const tools = [...d.querySelectorAll('#tools .tt-pill, #tools .sw-fab')].filter(shown);
      const b = box(btn);
      const covered = tools.filter(t => hits(box(t), b)).map(t => t.className);
      ok(`${route} at ${width}px: Save is clear of the stopwatch and ${tools.length - 1} timer pills`, tools.length === 4 && !covered.length && b.bottom <= box(nav).top + 0.5,
        `covered by ${covered.join(', ') || 'nothing'}; button ${Math.round(b.top)}–${Math.round(b.bottom)}, nav at ${Math.round(box(nav).top)}`);
      f.remove();
    }
  }
  localStorage.removeItem('bb.timers'); localStorage.removeItem('bb.stopwatch');
} catch (e) {
  ok('suite threw', false, String(e?.stack || e));
}

for (const [k, v] of Object.entries(saved)) { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
const failed = results.filter(r => !r.ok).length;
document.querySelector('#view').innerHTML = `<p><strong>${results.length - failed}/${results.length} passed</strong></p><table>${results.map(r =>
  `<tr><td>${r.ok ? '✓' : '✗'}</td><td>${r.name}${r.detail && !r.ok ? ` — ${r.detail}` : ''}</td></tr>`).join('')}</table>`;
fetch('/__smoke/release').catch(() => {});
</script>
</body>
</html>
