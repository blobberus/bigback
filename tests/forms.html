<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add / edit / upload forms · Bigback</title>
  <!-- Modules imported by this page get a fake store (the app in the iframes keeps the real one). -->
  <script type="importmap">{ "imports": { "../js/store.js": "./fixtures/fake-store.js" } }</script>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/editor.css">
  <style>
    body { padding-bottom: 24px; }
    td { padding: 4px 8px; border-top: 1px solid var(--line); font-size: .85rem; vertical-align: top; }
    #frames iframe { display: block; box-sizing: content-box; height: 760px; border: 1px solid var(--line); margin: 8px 0; }
  </style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/forms.html
     Loads the real app in phone-width iframes (no token: reads only, never writes) and checks
     the forms the way a phone user meets them. Then mounts the forms on this page against
     tests/fixtures/fake-store.js to finish saves and uploads. Needs real time. -->
<a id="topbar-back" hidden></a>
<main id="view"><p class="muted">Running…</p></main>
<div id="frames"></div>
<img hidden alt="" src="/__smoke/hold">
<script type="module">
const results = [];
const ok = (name, cond, detail = '') => { results.push({ name, ok: !!cond, detail }); if (!cond) console.error(`Test failed: ${name} ${detail}`); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const KEYS = ['bb.timers', 'bb.stopwatch', 'bb.draft:new', 'bb.draft:upload', 'bb.draft:edit:pan-seared-chicken'];
const saved = Object.fromEntries(KEYS.map(k => [k, localStorage.getItem(k)]));

/** Resolve once the routed view has rendered (has children and isn't busy). */
function rendered(frame, ms = 5000) {
  return new Promise(resolve => {
    const t0 = performance.now();
    (function poll() {
      const v = frame.contentDocument?.getElementById('view');
      if ((v && v.children.length && v.getAttribute('aria-busy') !== 'true') || performance.now() - t0 > ms) setTimeout(resolve, 400);
      else setTimeout(poll, 50);
    })();
  });
}
async function load(route, width) {
  const f = document.createElement('iframe');
  f.style.width = `${width}px`;
  f.title = route;
  f.src = '../index.html' + route;
  document.getElementById('frames').append(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  await rendered(f);
  return f;
}
const box = el => el.getBoundingClientRect();
const hits = (a, b) => a.left < b.right && b.left < a.right && a.top < b.bottom && b.top < a.bottom;
const shown = el => el.getClientRects().length > 0 && getComputedStyle(el).visibility !== 'hidden';

try {
  /* ---- the kitchen tools never cover the sticky Save button ---- */
  const now = Date.now();
  localStorage.setItem('bb.timers', JSON.stringify([
    { id: 'tf1', label: 'Simmer sauce', seconds: 1500, endAt: now + 1400e3, pausedLeft: null, slug: null, stepId: null, done: false, doneAt: null },
    { id: 'tf2', label: 'Rest the chicken thighs', seconds: 300, endAt: null, pausedLeft: 200e3, slug: null, stepId: null, done: false, doneAt: null },
    { id: 'tf3', label: 'Bake', seconds: 2400, endAt: now + 2000e3, pausedLeft: null, slug: null, stepId: null, done: false, doneAt: null }]));
  localStorage.setItem('bb.stopwatch', JSON.stringify({ running: true, startedAt: now - 65e3, accumulated: 0, laps: [] }));
  for (const [route, sel] of [['#/add/custom', '[data-save]'], ['#/edit/pan-seared-chicken', '[data-save]'], ['#/add/upload', '[data-send]']]) {
    for (const width of [360, 390]) {
      const f = await load(route, width), d = f.contentDocument;
      const btn = d.querySelector(sel), nav = d.querySelector('.bottomnav');
      const tools = [...d.querySelectorAll('#tools .tt-pill, #tools .sw-fab')].filter(shown);
      const b = box(btn);
      const covered = tools.filter(t => hits(box(t), b)).map(t => t.className);
      ok(`${route} at ${width}px: Save is clear of the stopwatch and ${tools.length - 1} timer pills`, tools.length === 4 && !covered.length && b.bottom <= box(nav).top + 0.5,
        `covered by ${covered.join(', ') || 'nothing'}; button ${Math.round(b.top)}–${Math.round(b.bottom)}, nav at ${Math.round(box(nav).top)}`);
      f.remove();
    }
  }
  localStorage.removeItem('bb.timers'); localStorage.removeItem('bb.stopwatch');

  /* long unbroken text (a pasted link) never widens the page */
  const f = await load('#/add/custom', 360), d = f.contentDocument, de = d.documentElement;
  const ing = d.querySelector('#ed-ing');
  ing.value = '2 cups flour (see https://www.kingarthurbaking.com/learn/guides/flour-weight-chart?utm_source=share)\n1 tbsp oil';
  ing.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }));
  await wait(300);                                          // the preview is debounced
  ok('a link pasted into an ingredient doesn’t make the 360px page scroll sideways', !!d.querySelector('.ed-pv-item') && de.scrollWidth <= de.clientWidth,
    `scrollWidth ${de.scrollWidth} > ${de.clientWidth}`);
  f.remove();
} catch (e) {
  ok('suite threw', false, String(e?.stack || e));
}

/* ---- the forms on this page, against the fake store (all iframes are gone by now) ---- */
const prefsBefore = localStorage.getItem('bb.prefs');
const sandbox = document.createElement('div');
document.body.append(sandbox);
const frame = () => new Promise(r => requestAnimationFrame(() => r()));
const type = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); };
const toastText = () => document.getElementById('toasts')?.textContent || '';
const confirmTop = () => [...document.querySelectorAll('.sheet-backdrop')].at(-1)?.querySelector('[data-i="1"]')?.click();
const hashIs = h => history.replaceState(null, '', h);
try {
  const S = await import('../js/store.js');
  ok('this page runs on the fake store', Array.isArray(S.calls));
  const { mountUploadForm } = await import('../js/components/editor-upload.js');
  const { mountRecipeForm } = await import('../js/components/editor-form.js');
  const pendingView = await import('../js/views/pending.js');

  /* work that finishes after you've moved to another page leaves that page alone */
  const sendText = async () => {
    const off = mountUploadForm(sandbox);
    await frame();
    sandbox.querySelector('[data-mode="text"]').click();
    type(sandbox.querySelector('#up-text'), '2 cups flour\n\nMix and bake 30 minutes.');
    S.hold('uploadToInbox');
    sandbox.querySelector('[data-form]').requestSubmit();
    await wait(20);
    return off;
  };
  let off = await sendText();
  off();                                                  // the router's cleanup: you tapped Recipes
  sandbox.innerHTML = '<p id="elsewhere">Recipes list</p>';
  S.release('uploadToInbox'); await wait(30);
  ok('an upload that lands after you left doesn’t take over the page you went to', !!sandbox.querySelector('#elsewhere') && !sandbox.querySelector('.up-done'), sandbox.textContent.replace(/\s+/g, ' ').trim().slice(0, 60));
  ok('…it still says it arrived and drops the draft', /Sent to your inbox/.test(toastText()) && !localStorage.getItem('bb.draft:upload'));
  off = await sendText();
  S.release('uploadToInbox'); await wait(30);
  ok('staying on the form shows the “In your inbox” page', !!sandbox.querySelector('.up-done'));
  off(); sandbox.innerHTML = '';

  try {
    localStorage.setItem('bb.prefs', JSON.stringify({ ...JSON.parse(prefsBefore || '{}'), token: 'test-not-a-token' }));   // fake store: never sent anywhere
    const saveNew = async () => {
      localStorage.removeItem('bb.draft:new');
      const offForm = mountRecipeForm(sandbox, { recipe: null });
      type(sandbox.querySelector('#ed-title'), 'Test toast');
      type(sandbox.querySelector('#ed-ing'), '2 slices bread\n1 tbsp butter');
      type(sandbox.querySelector('#ed-steps'), 'Toast the bread for 3 minutes.\n\nButter it.');
      S.hold('saveRecipe');
      sandbox.querySelector('[data-form]').requestSubmit();
      await wait(20);
      return offForm;
    };
    hashIs('#/add/custom');
    off = await saveNew();
    off(); hashIs('#/convert');                             // left for Convert while it saved
    S.release('saveRecipe'); await wait(30);
    ok('a save that finishes after you left doesn’t pull you back', location.hash === '#/convert' && /Recipe saved/.test(toastText()), location.hash);
    hashIs('#/add/custom');
    off = await saveNew();
    S.release('saveRecipe'); await wait(30);
    ok('staying on the form opens the saved recipe', location.hash === '#/r/test-recipe', location.hash);
    off(); sandbox.innerHTML = '';
  } finally {
    if (prefsBefore == null) localStorage.removeItem('bb.prefs'); else localStorage.setItem('bb.prefs', prefsBefore);
  }

  const recipe = { slug: 'test-dish', title: 'Test dish', status: 'custom', image: 'media/test-dish/hero.jpg', time: {},
    ingredients: [{ id: 'i1', qty: 2, qtyMax: null, unit: null, item: 'eggs', note: null, section: null }],
    steps: [{ id: 's1', section: null, text: 'Boil the eggs for 8 minutes.', timers: [], tip: null }] };
  const deleteAndLeave = async to => {
    hashIs('#/edit/test-dish');
    const offForm = mountRecipeForm(sandbox, { recipe });
    S.hold('deleteRecipe');
    sandbox.querySelector('[data-act="delete"]').click(); await frame();
    confirmTop(); await wait(20);
    offForm(); hashIs(to);
    S.release('deleteRecipe'); await wait(30);
    sandbox.innerHTML = '';
    return location.hash;
  };
  ok('a delete that finishes after you left keeps you where you went', await deleteAndLeave('#/settings') === '#/settings');
  ok('…unless that’s the deleted recipe’s own page', await deleteAndLeave('#/r/test-dish') === '#/');

  /* photo: remove the current one, pick a new one, remove that too → no photo */
  const pickPhoto = () => {
    const dt = new DataTransfer();
    dt.items.add(new File([new Uint8Array(8)], 'new.png', { type: 'image/png' }));
    const input = sandbox.querySelector('[data-hero]');
    input.files = dt.files;
    input.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const photoState = () => `${sandbox.querySelector('.ed-photo-pick img')?.alt || 'no photo'} | ${sandbox.querySelector('.ed-photo-bar .hint')?.textContent || ''}`;
  let offForm = mountRecipeForm(sandbox, { recipe });
  sandbox.querySelector('[data-act="photo-remove"]').click();
  pickPhoto();
  ok('a new photo replaces a removed one', photoState() === 'New photo preview | New photo · resized before upload', photoState());
  sandbox.querySelector('[data-act="photo-remove"]').click();
  ok('removing the new photo too leaves no photo (the old one doesn’t come back)', /^no photo \| The current photo will be removed/.test(photoState()), photoState());
  sandbox.querySelector('[data-act="photo-restore"]').click();
  ok('…and Undo brings the current photo back', photoState() === 'Current photo | Current photo', photoState());
  pickPhoto(); sandbox.querySelector('[data-act="photo-remove"]').click();
  ok('removing a new photo over a kept one goes back to the kept one', photoState() === 'Current photo | Current photo', photoState());
  offForm(); sandbox.innerHTML = '';

  S.setPending({ id: 'test-up', kind: 'file', title: 'Lasagna', files: ['inbox/test-up/Grandmas_lasagna_recipe_card_scan_final_version_2.pdf'], createdAt: new Date().toISOString() });
  hashIs('#/pending/test-up');
  sandbox.style.width = '328px';                            // a 360px phone less the page padding
  const offPending = await pendingView.render(sandbox, { id: 'test-up' });
  const wide = [...sandbox.querySelectorAll('*')].filter(el => !(el instanceof SVGElement) && box(el).right > box(sandbox).right + 0.5);
  ok('a long file name in an upload is cut short, not wider than the page', !wide.length, wide.map(el => `${el.tagName.toLowerCase()}.${el.className} → ${Math.round(box(el).right)}px`).join(', '));
  sandbox.style.width = '';
  S.hold('deletePending');
  sandbox.querySelector('[data-act="delete"]').click(); await frame();
  confirmTop(); await wait(20);
  offPending(); hashIs('#/playlists');
  S.release('deletePending'); await wait(30);
  ok('deleting an upload, then leaving: you stay on the new page', location.hash === '#/playlists', location.hash);
  sandbox.innerHTML = '';

  /* the inbox list is on the Add page: an upload's page leads back there */
  hashIs('#/pending/test-up');
  const offPending2 = await pendingView.render(sandbox, { id: 'test-up' });
  ok('an upload’s back arrow returns to the inbox list on Add', document.getElementById('topbar-back').getAttribute('href') === '#/add');
  sandbox.querySelector('[data-act="delete"]').click(); await frame();
  confirmTop(); await wait(30);
  ok('…and so does deleting it', location.hash === '#/add', location.hash);
  offPending2(); sandbox.innerHTML = '';

  /* a page still loading when you leave doesn't paint over the next one (or keep its handlers) */
  const addView = await import('../js/views/add.js');
  const leaveWhileLoading = async (hash, name, renderIt) => {
    hashIs(hash);
    S.hold(name);
    const done = renderIt();
    await wait(10);
    hashIs('#/convert');                                    // the router moved on: next view rendered
    sandbox.innerHTML = '<p id="next-page">Convert</p><button type="button" data-act="delete">Delete</button>';
    S.release(name);
    const cleanup = await done;
    await wait(10);
    sandbox.querySelector('[data-act="delete"]').click(); await frame();
    const live = [...document.querySelectorAll('.sheet-backdrop')].filter(w => !w.inert);   // closing ones are inert
    const sheetOpened = live.length > 0;
    live.forEach(w => w.click());
    await wait(250);
    const intact = !!sandbox.querySelector('#next-page');
    cleanup?.(); sandbox.innerHTML = '';
    return [intact, sheetOpened];
  };
  ok('an upload page that loads after you left leaves the next page alone', JSON.stringify(await leaveWhileLoading('#/pending/test-up', 'getPending',
    () => pendingView.render(sandbox, { id: 'test-up' }))) === '[true,false]');
  S.setRecipe(recipe);
  ok('…and so does the edit form', JSON.stringify(await leaveWhileLoading('#/edit/test-dish', 'getRecipe',
    () => addView.render(sandbox, { mode: 'edit', slug: 'test-dish' }))) === '[true,false]');
  localStorage.removeItem('bb.draft:edit:test-dish');
  ok('…and so does the Add page', JSON.stringify(await leaveWhileLoading('#/add', 'getIndex',
    () => addView.render(sandbox, { mode: 'choose' }))) === '[true,false]');
} catch (e) {
  ok('fake-store suite threw', false, String(e?.stack || e));
}
history.replaceState(null, '', location.pathname + location.search);
await wait(300);                                            // sheets finish closing

for (const [k, v] of Object.entries(saved)) { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
const failed = results.filter(r => !r.ok).length;
document.querySelector('#view').innerHTML = `<p><strong>${results.length - failed}/${results.length} passed</strong></p><table>${results.map(r =>
  `<tr><td>${r.ok ? '✓' : '✗'}</td><td>${r.name}${r.detail && !r.ok ? ` — ${r.detail}` : ''}</td></tr>`).join('')}</table>`;
fetch('/__smoke/release').catch(() => {});
</script>
</body>
</html>
