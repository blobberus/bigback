<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sheet gestures · Bigback</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/library.css">
  <style>body { padding-bottom: 24px; } .tall { height: 2000px; } td { padding: 4px 8px; border-top: 1px solid var(--line); font-size: .85rem; }</style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/sheet.html -->
<main id="view"><p class="muted">Running…</p><div class="tall"></div></main>
<!-- Animation frames need real time: this holds smoke.py's DOM dump until the release below. -->
<img hidden alt="" src="/__smoke/hold">
<script type="module">
import { sheet, promptSheet } from '../js/ui.js';
const results = [];
const ok = (name, cond, detail = '') => { results.push({ name, ok: !!cond, detail }); if (!cond) console.error(`Test failed: ${name} ${detail}`); };
const frame = () => new Promise(r => requestAnimationFrame(() => r()));
const wait = ms => new Promise(r => setTimeout(r, ms));
const touch = (el, type, y, x = 200) => {
  const t = new Touch({ identifier: 1, target: el, clientX: x, clientY: y });
  const ev = new TouchEvent(type, { touches: type === 'touchend' ? [] : [t], changedTouches: [t], bubbles: true, cancelable: true });
  el.dispatchEvent(ev);
  return ev;
};
const open = (opts = {}) => {
  let res = null;
  const p = sheet({ title: 'Rating', body: `<div style="height:${opts.h || 200}px">body</div>`, actions: [{ label: 'Done', value: true }], ...opts }).then(v => { res = { v }; });
  const wrap = document.querySelector('.sheet-backdrop:last-of-type'), box = wrap.querySelector('.sheet');
  return { p, wrap, box, result: () => res };
};

try {
  window.scrollTo(0, 300);
  let s = open();
  await frame(); await frame();
  ok('open sheet locks the page behind', document.documentElement.classList.contains('sheet-open') && getComputedStyle(document.body).overflow === 'hidden');
  ok('backdrop takes no pan gestures; sheet scrolls only itself', getComputedStyle(s.wrap).touchAction === 'none'
    && getComputedStyle(s.box).overscrollBehaviorY === 'contain');

  // short pull springs back
  touch(s.box, 'touchstart', 500); touch(s.box, 'touchmove', 510); const mv = touch(s.box, 'touchmove', 530);
  ok('pulling down moves the sheet (and not the page)', /translateY\(30px\)/.test(s.box.style.transform) && mv.defaultPrevented, s.box.style.transform);
  await wait(300); touch(s.box, 'touchend', 530);
  await wait(50);
  ok('a short slow pull springs back', !s.result() && s.box.style.transform === '' && document.contains(s.wrap));

  // long pull closes
  touch(s.box, 'touchstart', 400); touch(s.box, 'touchmove', 420); touch(s.box, 'touchmove', 600); touch(s.box, 'touchend', 600);
  await s.p;
  ok('swiping down closes it', s.result() && s.result().v === null);
  ok('closing unlocks the page', !document.documentElement.classList.contains('sheet-open'));

  // quick flick closes
  s = open(); await frame();
  touch(s.box, 'touchstart', 400); touch(s.box, 'touchmove', 420); touch(s.box, 'touchmove', 470); touch(s.box, 'touchend', 470);
  await s.p;
  ok('a quick flick closes it', s.result()?.v === null);

  // scrolled long sheet: pulling down scrolls the sheet instead
  s = open({ h: 3000 }); await frame();
  s.box.scrollTop = 200;
  touch(s.box, 'touchstart', 400); touch(s.box, 'touchmove', 420); const mv2 = touch(s.box, 'touchmove', 600); touch(s.box, 'touchend', 600);
  await wait(50);
  ok('mid-scroll, a pull scrolls the sheet rather than closing it', !s.result() && !mv2.defaultPrevented && s.box.style.transform === '');
  ok('upward drag never drags the sheet', (() => { s.box.scrollTop = 0; touch(s.box, 'touchstart', 400); touch(s.box, 'touchmove', 380); const e = touch(s.box, 'touchmove', 300); touch(s.box, 'touchend', 300); return !e.defaultPrevented && s.box.style.transform === ''; })());

  // tap outside
  s.wrap.click();
  await s.p;
  ok('tapping outside closes it', s.result()?.v === null);

  // not dismissable: no swipe, no tap outside
  s = open({ dismissable: false }); await frame();
  touch(s.box, 'touchstart', 400); touch(s.box, 'touchmove', 420); touch(s.box, 'touchmove', 650); touch(s.box, 'touchend', 650);
  s.wrap.click();
  await wait(50);
  ok('sheets that need an answer ignore swipes and outside taps', !s.result() && document.contains(s.wrap));
  ok('…and show no swipe grip (it would promise a swipe that does nothing)', !s.box.querySelector('.sheet-grip'));
  s.box.querySelector('[data-i]').click();
  await s.p;
  ok('…and close from their buttons', s.result()?.v === true && !document.documentElement.classList.contains('sheet-open'));

  // on-screen keyboard: the backdrop follows the visual viewport, so the sheet sits above the keyboard
  const de = document.documentElement, vvp = window.visualViewport;
  s = open({ h: 40 }); await frame(); await frame();
  ok('open sheet is fitted to the visible area', de.style.getPropertyValue('--vv-h') === `${Math.round(vvp.height)}px`
    && Math.abs(s.wrap.getBoundingClientRect().height - vvp.height) < 2, de.style.getPropertyValue('--vv-h'));
  de.style.setProperty('--vv-h', '320px');                // what a raised keyboard leaves visible
  await wait(300);                                         // slide-in finished
  const bb = s.box.getBoundingClientRect();
  ok('with the keyboard up the sheet ends above it', bb.bottom <= 321 && bb.height <= 296, `${bb.top}-${bb.bottom}`);
  s.wrap.click(); await s.p;
  ok('closing the last sheet clears the fit', !de.style.getPropertyValue('--vv-h') && !de.classList.contains('kb-open'));

  // a focused field low in a long sheet is scrolled above the sticky footer
  s = open({ h: 1, className: 'picker-sheet', body: '<div style="height:1400px"></div><input class="input" id="low">' });
  await wait(300);
  const low = s.box.querySelector('#low');
  low.focus({ preventScroll: true }); s.box.scrollTop = 0;
  vvp.dispatchEvent(new Event('resize')); await frame(); await frame();
  const foot = s.box.querySelector('.sheet-actions');
  ok('focused field is scrolled into view above the footer', low.getBoundingClientRect().bottom <= foot.getBoundingClientRect().top + 1,
    `${low.getBoundingClientRect().bottom} vs ${foot.getBoundingClientRect().top}`);
  s.box.scrollTop = 0; await frame();
  ok('picker Done button stays visible without scrolling', getComputedStyle(foot).position === 'sticky'
    && foot.getBoundingClientRect().bottom <= s.box.getBoundingClientRect().bottom + 1
    && foot.getBoundingClientRect().top < s.box.getBoundingClientRect().bottom - 30);
  s.wrap.click(); await s.p;

  // prompt: Enter saves, but not the Enter that confirms an IME candidate (Japanese, Chinese…)
  let named = null;
  const pp = promptSheet('New playlist').then(v => { named = { v }; });
  const pin = [...document.querySelectorAll('.sheet .input')].at(-1);
  pin.value = 'きょうの';
  pin.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', isComposing: true, bubbles: true }));
  pin.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', keyCode: 229, bubbles: true }));    // Safari's flavour
  await wait(20);
  ok('Enter while an IME is composing doesn’t save the prompt', !named);
  pin.value = '今日の夕食';
  pin.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
  await pp;
  ok('…the next Enter does', named?.v === '今日の夕食', JSON.stringify(named));
  await wait(250);

  // keyboard up on a page (no sheet): the bottom nav steps aside instead of sliding around
  const nav = document.createElement('nav'); nav.className = 'bottomnav'; document.body.append(nav);
  const field = document.createElement('textarea'); document.querySelector('#view').append(field);
  Object.defineProperty(vvp, 'height', { configurable: true, get: () => de.clientHeight - 300 });   // fake keyboard
  field.focus({ preventScroll: true }); await frame(); await frame();
  ok('typing with the keyboard up → kb-open, nav steps aside', de.classList.contains('kb-open') && getComputedStyle(nav).visibility === 'hidden');
  field.blur(); await frame(); await frame();
  ok('…and it comes back when typing stops', !de.classList.contains('kb-open') && getComputedStyle(nav).visibility === 'visible');
  delete vvp.height;
  field.focus({ preventScroll: true }); await frame(); await frame();
  ok('a focused field without a keyboard (desktop) changes nothing', !de.classList.contains('kb-open'));
  field.blur(); await frame(); await frame();

  // iOS drift: the screen (visual viewport) and the layout viewport the nav is pinned to fall out of step
  const navBottom = () => nav.getBoundingClientRect().bottom;
  const atRest = navBottom();
  ok('no drift → nothing moves', !de.classList.contains('vv-drift') && Math.abs(atRest - vvp.height) < 2, `${atRest} vs ${vvp.height}`);
  Object.defineProperty(vvp, 'offsetTop', { configurable: true, get: () => 240 });
  window.dispatchEvent(new Event('scroll')); await frame(); await frame();
  ok('drifted → the nav goes back to the screen’s bottom edge', de.classList.contains('vv-drift')
    && Math.abs(navBottom() - (240 + vvp.height)) < 2, `${navBottom()} vs ${240 + vvp.height}`);
  Object.defineProperty(vvp, 'height', { configurable: true, get: () => de.clientHeight - 300 });
  vvp.dispatchEvent?.(new Event('resize')); window.dispatchEvent(new Event('scroll')); await frame(); await frame();
  ok('…but not while the keyboard is up (the nav stays put, out of its way)', !de.classList.contains('vv-drift'));
  delete vvp.height; delete vvp.offsetTop;
  window.dispatchEvent(new Event('scroll')); await frame(); await frame();
  ok('back in step → the correction is gone', !de.classList.contains('vv-drift') && !de.style.getPropertyValue('--vv-dy')
    && Math.abs(navBottom() - atRest) < 1, `${navBottom()} vs ${atRest}`);
  field.remove(); nav.remove();
} catch (e) {
  ok('suite threw', false, String(e?.stack || e));
}
const failed = results.filter(r => !r.ok).length;
document.querySelector('#view').innerHTML = `<p><strong>${results.length - failed}/${results.length} passed</strong></p><table>${results.map(r =>
  `<tr><td>${r.ok ? '✓' : '✗'}</td><td>${r.name}${r.detail && !r.ok ? ` — ${r.detail}` : ''}</td></tr>`).join('')}</table>`;
fetch('/__smoke/release').catch(() => {});
</script>
</body>
</html>
