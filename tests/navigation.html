<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Navigation glitches · Bigback</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body { padding-bottom: 24px; }
    .t-sum { font-weight: 700; margin: 0 0 12px; }
    .t-sum.bad { color: var(--danger); } .t-sum.good { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    td:first-child { width: 2.5em; font-weight: 800; }
    tr.pass td:first-child { color: var(--ok); } tr.fail td:first-child { color: var(--danger); }
    #frames iframe { display: block; width: 390px; height: 700px; border: 1px solid var(--line); margin: 8px 0; }
  </style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/navigation.html
     Drives the real app in a 390px iframe (no token: it reads the static JSON) the way a phone
     user moves around: quick Back while a page is still loading, the topbar ←, cook mode's exits.
     A page's data is made slow by wrapping the frame's fetch. -->
<main id="view"><p class="muted">Running…</p></main>
<!-- Scroll restore and the timers need real time: this holds smoke.py's DOM dump until the release below. -->
<img hidden alt="" src="/__smoke/hold">
<div id="frames"></div>
<script type="module">
const results = [];
const ok = (name, cond, detail = '') => { results.push({ name, ok: !!cond, detail: cond ? '' : detail }); if (!cond) console.error(`Test failed: ${name} ${detail}`); };
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 4000) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) { try { if (fn()) return true; } catch { /* not there yet */ } await wait(25); }
  return false;
}
/** The app in a fresh 390px frame at `hash`, with a clean session (cooking state, history). */
async function app(hash) {
  document.querySelectorAll('#frames iframe').forEach(f => f.remove());
  const f = document.createElement('iframe');
  f.src = '../index.html' + hash;
  document.getElementById('frames').append(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  const w = f.contentWindow, d = f.contentDocument;
  w.sessionStorage.clear();
  const view = () => d.getElementById('view');
  await until(() => view().children.length && view().getAttribute('aria-busy') !== 'true');
  return { f, w, d, view, $: s => view().querySelector(s) };
}
/** Delay the frame's fetches whose URL matches `re` by `ms`. */
function slow(w, re, ms) {
  const real = w.fetch.bind(w);
  w.fetch = (u, o) => (re.test(String(u)) ? wait(ms).then(() => real(u, o)) : real(u, o));
}
const go = (w, hash) => { w.location.hash = hash; };

try {
  /* ---------- a page still loading when you move on ---------- */
  {
    const a = await app('#/');
    slow(a.w, /recipes\/tteokguk\.json/, 500);
    go(a.w, '#/r/tteokguk'); await wait(120); go(a.w, '#/');
    await wait(900);
    ok('Back while a recipe loads: the list stays (the recipe does not paint over it)',
      a.$('.lib') && !a.$('.rx') && a.d.getElementById('topbar-title').textContent === 'Recipes',
      `view: ${a.view().firstElementChild?.className}, title: ${a.d.getElementById('topbar-title').textContent}`);
    go(a.w, '#/r/tteokguk');
    await until(() => a.$('.rx-num'));
    a.$('.rx-num').click();
    ok('opening it again works as usual (a tap on the step number checks it off)', a.$('.rx-step.is-done'), a.$('.rx-step')?.className);
  }
  {
    const a = await app('#/');
    slow(a.w, /recipes\/mapo-tofu\.json/, 500);
    go(a.w, '#/r/mapo-tofu/cook'); await wait(120); go(a.w, '#/');
    await wait(900);
    ok('Back while cook mode loads: the list stays', a.$('.lib') && !a.$('.ck'), a.view().firstElementChild?.className);
    a.d.dispatchEvent(new a.w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    await wait(300);
    ok('…and cook mode left no key handler behind (Esc on the list stays on the list)', a.w.location.hash === '#/', a.w.location.hash);
  }
  {
    const a = await app('#/convert');
    slow(a.w, /recipes\/index\.json/, 600);
    go(a.w, '#/'); await wait(150); go(a.w, '#/playlists'); await wait(40); go(a.w, '#/');
    await until(() => a.$('.rcard'), 3000); await wait(700);
    a.$('[data-act="filters"]').click();
    await wait(300);
    const n = a.d.querySelectorAll('.filter-sheet').length;
    ok('Recipes → Playlists → Recipes during a slow first load: one set of handlers (one Filters sheet per tap)', n === 1, `${n} sheets`);
  }

  /* ---------- the topbar ← and cook mode's exits go back where you came from ---------- */
  const topBack = a => a.d.getElementById('topbar-back');
  {
    const a = await app('#/?q=chicken');
    const len = a.w.history.length;
    a.$('.rcard-link').click();
    await until(() => a.$('.rx'));
    ok('a recipe opened from a search: ← points at that search', topBack(a).getAttribute('href') === '#/?q=chicken', topBack(a).getAttribute('href'));
    topBack(a).click();
    await until(() => a.$('.lib'));
    await wait(100);
    ok('…and tapping it comes back to the search (same entry, no new one)',
      a.w.location.hash === '#/?q=chicken' && a.$('.search-input').value === 'chicken' && a.w.history.length === len + 1,
      `${a.w.location.hash} · input "${a.$('.search-input')?.value}" · history +${a.w.history.length - len}`);

    a.$('.rcard-link').click();
    await until(() => a.$('.rx-cook-btn'));
    a.$('.rx-cook-btn').click();
    await until(() => a.$('.ck'));
    a.$('.ck-exit').click();
    await until(() => a.$('.rx'));
    await wait(100);
    ok('cook mode × goes back to the recipe page it came from (no new entry)', a.w.history.length === len + 2, `history +${a.w.history.length - len}`);
    topBack(a).click();
    await until(() => a.$('.lib'));
    ok('…whose ← still leads to the search', a.w.location.hash === '#/?q=chicken' && a.$('.search-input').value === 'chicken', a.w.location.hash);
  }
  {
    const a = await app('#/?q=chicken');     // a fresh frame: history.length is only reliable before any Back
    a.$('.rcard-link').click();
    await until(() => a.$('.rx'));
    const atRecipe = a.w.history.length, page = a.w.location.hash;
    a.d.querySelector('#topbar-actions a[href^="#/edit/"]').click();
    await until(() => a.$('.ed-title'));
    topBack(a).click();
    await until(() => a.$('.rx'));
    await wait(100);
    ok('Edit’s ← goes back to the recipe page it came from (no new entry)', a.w.location.hash === page && a.w.history.length === atRecipe + 1,
      `${a.w.location.hash} · history +${a.w.history.length - atRecipe}`);
    topBack(a).click();
    await until(() => a.$('.lib'));
    ok('…whose ← still leads to the search', a.w.location.hash === '#/?q=chicken' && a.$('.search-input').value === 'chicken', a.w.location.hash);
  }
  {
    const a = await app('#/');
    a.w.scrollTo(0, 400);
    await wait(400);                       // library.js saves the position 160 ms after scrolling stops
    const y = a.w.scrollY;
    [...a.view().querySelectorAll('.rcard-link')].find(l => l.getBoundingClientRect().top > 200).click();
    await until(() => a.$('.rx'));
    topBack(a).click();
    await until(() => a.$('.lib'));
    await wait(200);
    ok('← from a recipe puts the list back where you scrolled it', y > 300 && Math.abs(a.w.scrollY - y) < 2, `left at ${y}, back at ${a.w.scrollY}`);
  }
  {
    const lib = await (await fetch('../data/library.json', { cache: 'no-store' })).json();
    const pl = (lib.playlists || []).find(p => p.recipes?.length);
    if (pl) {
      const a = await app(`#/playlist/${pl.id}`);
      a.$('.rcard-link').click();
      await until(() => a.$('.rx'));
      topBack(a).click();
      await until(() => a.$('.lib'));
      ok('← from a recipe opened in a playlist goes back to the playlist (not all Recipes)', a.w.location.hash === `#/playlist/${pl.id}`, a.w.location.hash);
    } else ok('playlist case skipped: no playlist with recipes', true);
  }
  {
    const a = await app('#/r/mapo-tofu');
    const n = a.view().querySelectorAll('.rx-step').length;
    a.$('.rx-cook-btn').click();
    await until(() => a.$('.ck'));
    for (let k = 0; k < 40 && a.$('[data-act="next"]'); k++) a.$('[data-act="next"]').click();
    a.$('[data-act="finish"]').click();
    await until(() => a.$('.rx-cook-btn'));
    const meta = a.$('[data-steps-meta]').textContent.replace(/\s+/g, ' ').trim();
    ok('cooking through to Finish checks off every step, last one included', n > 1 && meta.startsWith(`${n} of ${n} done`), meta);
    ok('…and the recipe page offers a fresh start, not "Resume cooking · step N"', /Start cook mode/.test(a.$('.rx-cook-btn').textContent), a.$('.rx-cook-btn').textContent.trim());
  }
  {
    const a = await app('#/r/tteokguk');
    ok('a recipe opened directly (deep link): ← is the Recipes list', topBack(a).getAttribute('href') === '#/', topBack(a).getAttribute('href'));
    topBack(a).click();
    await until(() => a.$('.lib'));
    ok('…and tapping it opens the list', a.w.location.hash === '#/', a.w.location.hash);
  }
} catch (e) {
  ok('test page ran', false, String(e.stack || e));
}

const failed = results.filter(r => !r.ok);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('view').innerHTML =
  `<h1>Navigation</h1><p class="t-sum ${failed.length ? 'bad' : 'good'}">${results.length - failed.length} passed · ${failed.length} failed</p>` +
  `<table>${results.map(r => `<tr class="${r.ok ? 'pass' : 'fail'}"><td>${r.ok ? 'ok' : 'FAIL'}</td><td>${esc(r.name)}${r.detail ? `<br><small>${esc(r.detail)}</small>` : ''}</td></tr>`).join('')}</table>`;
document.querySelectorAll('#frames iframe').forEach(f => f.remove());
fetch('/__smoke/release');
</script>
</body>
</html>
