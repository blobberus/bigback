<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Resolve the app's relative paths (recipes/…, media/…) from the repo root, as in index.html. -->
  <base href="/">
  <title>Recipe page with a token · Bigback</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/library.css">
  <link rel="stylesheet" href="css/recipe.css">
  <style>
    .t-sum { font-weight: 700; margin: 0 0 12px; }
    .t-sum.bad { color: var(--danger); } .t-sum.good { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    td:first-child { width: 2.5em; font-weight: 800; }
    tr.pass td:first-child { color: var(--ok); } tr.fail td:first-child { color: var(--danger); }
    #app { width: 390px; }
  </style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/recipe.html
     The recipe view with a (fake) GitHub token, so the write paths run (tests/fake-github.js:
     reads serve the repo's files, commits are only recorded, the token is removed again before
     the page reports). Nothing leaves the machine. -->
<header class="topbar"><a id="topbar-back" class="icon-btn" href="#/" aria-label="Back" hidden>←</a><h1 id="topbar-title">Bigback</h1><div id="topbar-actions"></div></header>
<main id="view"><p class="muted">Running…</p></main>
<div id="app" tabindex="-1"></div>
<!-- The batched library commit (1.2 s) needs real time: this holds smoke.py's DOM dump until the release below. -->
<img hidden alt="" src="/__smoke/hold">
<script type="module">
import { fakeGitHub } from './tests/fake-github.js';
const results = [];
const ok = (name, cond, detail = '') => { results.push({ name, ok: !!cond, detail: cond ? '' : detail }); if (!cond) console.error(`Test failed: ${name} ${detail}`); };
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 4000) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) { try { if (fn()) return true; } catch { /* not there yet */ } await wait(25); }
  return false;
}

const BARE = 'zz-no-steps';
const gh = fakeGitHub({ files: { [`recipes/${BARE}.json`]: {
  schemaVersion: 1, slug: BARE, title: 'Typed in, no steps yet', summary: '', status: 'custom', source: { type: 'custom' },
  image: null, servings: null, time: {}, equipment: [], ingredients: [{ id: 'i1', qty: 2, unit: 'cup', item: 'rice' }], steps: [], changelog: []
} } }), { commits } = gh;
const SLUG = 'tteokguk';

let off = null;
try {
  sessionStorage.removeItem(`bb.rx:${SLUG}`);
  const root = document.getElementById('app');
  const { render } = await import('./js/views/recipe.js');
  off = await render(root, { slug: SLUG });
  const $ = s => root.querySelector(s);

  /* rating from the Edit sheet */
  const hero = $('.rx-hero img, .rx-hero'), stepsList = $('.rx-steps');
  let repaints = 0;
  const mo = new MutationObserver(recs => { repaints += recs.filter(r => r.target === root).length; });
  mo.observe(root, { childList: true });
  const edit = $('[data-act="meta"]');
  edit.focus(); edit.click();
  await until(() => document.querySelector('.meta-sheet [data-rate="7"]'));
  document.querySelector('.meta-sheet [data-rate="7"]').click();
  await until(() => /7\/10/.test($('.rx-you-meta').textContent));
  ok('a rating from the Edit sheet shows on the page right away', /7\/10/.test($('.rx-you-meta').textContent), $('.rx-you-meta').textContent);
  await until(() => commits.length, 3000);
  await wait(100);
  ok('…and is saved as one library commit', commits.length === 1 && commits[0].paths.join() === 'data/library.json', JSON.stringify(commits));
  ok('…without re-rendering the page (hero and steps are the same elements, before and after the commit)',
    !repaints && root.contains(hero) && root.contains(stepsList), `${repaints} repaints`);
  document.querySelector('.meta-sheet .sheet-actions .btn-primary').click();
  await wait(300);
  ok('closing the sheet puts focus back on the Edit button', document.activeElement === edit && root.contains(edit), document.activeElement?.outerHTML.slice(0, 80));
  mo.disconnect();

  /* step notes: saved from the keyboard (focus in the text) and with the Save button */
  const where = () => { const a = document.activeElement; return `${a?.tagName}.${a?.className} ${a?.dataset?.act || ''}`; };
  for (const [sid, how] of [['s1', 'keyboard'], ['s2', 'button']]) {
    $(`[data-act="note-open"][data-key="${sid}"]`).click();
    await until(() => $(`textarea[data-composer="${sid}"]`));
    const ta = $(`textarea[data-composer="${sid}"]`), save = ta.form.querySelector('[type="submit"]');
    ta.focus(); ta.value = `note ${how}`; ta.dispatchEvent(new Event('input', { bubbles: true }));
    const before = commits.length;
    if (how === 'keyboard') ta.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', ctrlKey: true, bubbles: true }));
    else { save.focus(); save.click(); }
    await until(() => commits.length > before && !$(`textarea[data-composer="${sid}"]`));
    await wait(100);
    ok(`a step note saved (${how}) shows under its step`, [...root.querySelectorAll(`#step-${sid} .rx-note-text`)].some(x => x.textContent === `note ${how}`));
    const a = document.activeElement;
    ok(`…and focus moves to that step's "Add another note" button (${how})`, a?.dataset?.act === 'note-open' && a.dataset.key === sid, where());
  }
  {
    const ta = $('textarea[data-composer="recipe"]'), save = ta.form.querySelector('[type="submit"]'), before = commits.length;
    ta.value = 'kids loved it'; ta.dispatchEvent(new Event('input', { bubbles: true }));
    save.focus(); save.click();
    await until(() => commits.length > before && /kids loved it/.test($('[aria-labelledby="rx-h-notes"] .rx-notes')?.textContent || ''));
    await wait(100);
    const a = document.activeElement;
    ok('a recipe note saved with the button: the empty composer stays, focus back on its Save button',
      !$('textarea[data-composer="recipe"]').value && a?.type === 'submit' && a.closest('[data-composer-form="recipe"]'), where());
  }
  ok('a recipe with steps offers cook mode (page button + topbar)', $('.rx-cook-btn') && document.querySelector(`#topbar-actions [href="#/r/${SLUG}/cook"]`));
  off(); off = null;

  /* a recipe typed in without steps yet */
  off = await render(root, { slug: BARE });
  ok('a recipe without steps: no cook-mode button that leads to "No steps to cook yet"',
    $('.rx-title') && !$('.rx-cook-btn') && !document.querySelector('#topbar-actions [href$="/cook"]'), $('.rx-cook-btn')?.outerHTML || 'topbar link');
  ok('…and no "Tap a number to check it off" hint with no numbers', !$('[data-steps-meta]').textContent.trim(), $('[data-steps-meta]').textContent);
} catch (e) {
  ok('test page ran', false, String(e.stack || e));
} finally {
  off?.();
  document.querySelectorAll('.sheet-backdrop').forEach(s => s.remove());
  gh.restore();
  sessionStorage.removeItem(`bb.rx:${SLUG}`);
}

const failed = results.filter(r => !r.ok);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
document.getElementById('app').innerHTML = '';
document.getElementById('view').innerHTML =
  `<h1>Recipe page (token)</h1><p class="t-sum ${failed.length ? 'bad' : 'good'}">${results.length - failed.length} passed · ${failed.length} failed</p>` +
  `<table>${results.map(r => `<tr class="${r.ok ? 'pass' : 'fail'}"><td>${r.ok ? 'ok' : 'FAIL'}</td><td>${esc(r.name)}${r.detail ? `<br><small>${esc(r.detail)}</small>` : ''}</td></tr>`).join('')}</table>`;
fetch('/__smoke/release');
</script>
</body>
</html>
