<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingredient links + conversions · Bigback</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/recipe.css">
  <style>
    body { padding-bottom: 24px; }
    .t-sum { font-weight: 700; margin: 0 0 12px; }
    .t-sum.bad { color: var(--danger); } .t-sum.good { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    td:first-child { width: 2.5em; font-weight: 800; }
    tr.pass td:first-child { color: var(--ok); } tr.fail td:first-child { color: var(--danger); }
    #sandbox { position: absolute; left: 0; top: 200px; width: 390px; }
  </style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/ingredients.html -->
<main id="view"><p class="muted">Running…</p></main>
<div id="sandbox"></div>
<script type="module">
import { mentionMatcher, bindMentions } from '../js/components/recipe-mentions.js';
import { ingredientsHtml, bindIngredients } from '../js/components/recipe-ingredients.js';
import { stepTextHtml } from '../js/components/recipe-steps.js';
import { breakdown, unitInfo, findAmounts, findTemps, tempDetails, usEquivalent, gramsPerMl, scaleNote } from '../js/units.js';
import { toStr } from '../js/util.js';
import { rxPatch } from '../js/components/recipe-state.js';
import { sheet } from '../js/ui.js';

const results = [];
const canon = v => JSON.stringify(v);
function eq(name, got, want) {
  const ok = canon(got) === canon(want);
  results.push({ name, ok, detail: ok ? '' : `want ${canon(want)} got ${canon(got)}` });
  if (!ok) console.error(`Test failed: ${name} | want ${canon(want)} | got ${canon(got)}`);
}
const truthy = (name, cond, detail = '') => eq(name, !!cond, true) || (detail && !cond && (results[results.length - 1].detail = detail));

/* ---------- mention matcher ---------- */
const CHICKEN = [
  { id: 'i1', qty: 6, unit: null, item: 'bone-in, skin-on chicken thighs', note: 'about 2.5 lb, patted very dry' },
  { id: 'i2', qty: 2, unit: 'tsp', item: 'kosher salt', note: 'Diamond Crystal; use 1¼ tsp Morton' },
  { id: 'i3', qty: 1, unit: 'tsp', item: 'black pepper' },
  { id: 'i4', qty: 1, unit: 'tsp', item: 'neutral oil' },
  { id: 'i5', qty: 4, unit: 'clove', item: 'garlic', section: 'Pan sauce' },
  { id: 'i6', qty: 0.5, unit: 'cup', item: 'chicken stock', section: 'Pan sauce' },
  { id: 'i7', qty: 1, unit: null, item: 'lemon', section: 'Pan sauce' },
  { id: 'i8', qty: 3, unit: 'tbsp', item: 'cold unsalted butter', section: 'Pan sauce', note: 'cubed' },
  { id: 'i9', qty: 4, unit: 'sprig', item: 'fresh thyme', section: 'Pan sauce', note: 'or ½ tsp dried' }
];
const m = mentionMatcher(CHICKEN);
const linked = (text, match = m) => match(text).map(x => [text.slice(x.index, x.index + x.length), x.ids.join('+')]);

eq('thighs, salt, pepper', linked('Pat the thighs very dry and season all over with the salt and pepper.'),
  [['thighs', 'i1'], ['salt', 'i2'], ['pepper', 'i3']]);
eq('garlic and thyme; "1 tablespoon of fat" is not an ingredient', linked('Pour off all but 1 tablespoon of fat. Add the garlic and thyme over medium-low heat.'),
  [['garlic', 'i5'], ['thyme', 'i9']]);
eq('stock, lemon (in "lemon juice"), cold butter, salt', linked('Add the stock and scrape up the browned bits. Off the heat, add the lemon juice, then swirl in the cold butter. Taste and adjust salt.'),
  [['stock', 'i6'], ['lemon', 'i7'], ['butter', 'i8'], ['salt', 'i2']]);
eq('"chicken" (two ingredients) and "sauce" stay plain', linked('Rest the chicken 5 minutes. Spoon the sauce onto plates and set the thighs on top.'), [['thighs', 'i1']]);
eq('first mention per step only', linked('Add the garlic. Stir the garlic until golden.'), [['garlic', 'i5']]);
eq('amount already in the step → no link', linked('Add 2 tbsp butter and the garlic.'), [['garlic', 'i5']]);
eq('amount clause-scoped', linked('Add 2 tablespoons of the butter, garlic and thyme.'), [['garlic', 'i5'], ['thyme', 'i9']]);
eq('amount in parentheses after', linked('Add the butter (3 tbsp) and stir.'), []);
eq('durations and sizes are not amounts', [
  linked('Simmer 10 minutes and add the garlic.'), linked('Heat a 12-inch skillet with the oil.'), linked('Cook until tender, then add butter.')],
  [[['garlic', 'i5']], [['oil', 'i4']], [['butter', 'i8']]]);
eq('word numbers are amounts', linked('Add two cloves garlic.'), []);

const amb = mentionMatcher([
  { id: 'a', qty: 1, unit: 'tsp', item: 'black pepper' }, { id: 'b', qty: 1, unit: null, item: 'red bell pepper' },
  { id: 'c', qty: 2, unit: 'tbsp', item: 'neutral oil' }, { id: 'd', qty: 1, unit: 'tsp', item: 'toasted sesame oil' },
  { id: 'e', qty: 2, unit: 'tbsp', item: 'soy sauce' }, { id: 'f', qty: null, unit: null, item: 'flaky salt, for serving' },
  { id: 'g', qty: 2, unit: null, item: 'tomatoes' }, { id: 'h', qty: 1, unit: null, item: 'yellow onion' },
  { id: 'j', qty: 4, unit: null, item: 'garlic cloves' }, { id: 'k', qty: 2, unit: 'cup', item: 'shredded mozzarella' },
  { id: 'l', qty: 1, unit: 'lb', item: 'pork belly' }
]);
eq('"pepper" shared by two ingredients → no link; "bell pepper" → the bell pepper',
  [linked('Season with pepper.', amb), linked('Add the bell pepper.', amb)], [[], [['bell pepper', 'b']]]);
eq('"oil" → the ingredient whose whole name is oil', [linked('Heat the oil.', amb), linked('Drizzle with sesame oil.', amb)],
  [[['oil', 'c']], [['sesame oil', 'd']]]);
eq('generic "sauce" alone stays plain', [linked('Spoon the sauce over.', amb), linked('Add the soy sauce.', amb)], [[], [['soy sauce', 'e']]]);
eq('no quantity → no link', linked('Finish with flaky salt.', amb), []);
eq('plurals both ways', [linked('Add the tomato.', amb), linked('Soften the onions.', amb)], [[['tomato', 'g']], [['onions', 'h']]]);
eq('"garlic cloves" is called garlic; participles and -lly nouns', [linked('Smash the garlic.', amb), linked('Top with the mozzarella.', amb), linked('Score the belly.', amb)],
  [[['garlic', 'j']], [['mozzarella', 'k']], [['belly', 'l']]]);
const twice = mentionMatcher([{ id: 'x1', qty: 1, unit: 'cup', item: 'butter', section: 'Cake' }, { id: 'x2', qty: 4, unit: 'tbsp', item: 'unsalted butter', section: 'Frosting' }]);
eq('same ingredient in two sections → both amounts', twice('Cream the butter.').map(x => x.ids), [['x1', 'x2']]);
eq('…but a step in one of those sections means its own', [twice('Cream the butter.', { section: 'Frosting' }), twice('Cream the butter.', { section: 'Glaze' })].map(r => r.map(x => x.ids)), [[['x2']], [['x1', 'x2']]]);
const ownHtml = toStr(stepTextHtml({ id: 's2', section: 'Cake', text: 'Melt the butter.', timers: [] }, 2, { match: twice }));
truthy('stepTextHtml passes the step’s section on', /"q":1,[^\]]*"s":"Cake"/.test(ownHtml.replace(/&quot;/g, '"')) && !/Frosting/.test(ownHtml.replace(/&quot;/g, '"')), ownHtml);

const stepHtml = toStr(stepTextHtml({ id: 's9', text: 'Add the garlic and cook 1 minute.', timers: [] }, 9, { match: m }));
truthy('step text renders both an ingredient link and a timer link', /data-ingref="i5"[^>]*>garlic/.test(stepHtml) && /class="rx-dur"/.test(stepHtml), stepHtml);

/* ---------- unit conversions ---------- */
const flat = b => b && [...b.us, ...b.metric].map(l => l.text + (l.by ? ` (${l.by})` : ''));
const B = (qty, unit, item = 'water', f = 1, qtyMax = null) => flat(breakdown({ qty, qtyMax, unit, item }, f));
eq('1 cup water', B(1, 'cup'), ['8 fl oz', '16 tbsp', '48 tsp', '237 ml', '≈ 237 g (weight)']);
eq('⅓ cup: tablespoons + teaspoons', B(1 / 3, 'cup', 'milk'), ['2⅔ fl oz', '5 tbsp + 1 tsp', '16 tsp', '79 ml', '≈ 81 g (weight)']);
eq('3 tbsp butter: no fuzzy cup line; grams by weight', B(3, 'tbsp', 'cold unsalted butter'), ['1½ fl oz', '9 tsp', '44 ml', '≈ 43 g (weight)']);
eq('2 tsp → ⅔ tbsp; unknown density → no grams', B(2, 'tsp', 'kosher salt'), ['⅔ tbsp', '9.9 ml']);
eq('1 stick butter', B(1, 'stick', 'unsalted butter'), ['½ cup', '4 fl oz', '8 tbsp', '24 tsp', '118 ml', '≈ 114 g (weight)']);
eq('cinnamon stick, counts and cloves are not convertible', [B(1, 'stick', 'cinnamon'), B(6, null, 'eggs'), B(4, 'clove', 'garlic')], [null, null, null]);
eq('2½ lb → lb + oz, oz, kg', B(2.5, 'lb', 'chicken thighs'), ['2 lb 8 oz', '40 oz', '1.13 kg']);
eq('200 g flour → oz, lb, and cups by volume', B(200, 'g', 'all-purpose flour'), ['≈ ½ lb', '7 oz', '≈ 1⅔ cups (volume)']);
eq('500 ml stock', B(500, 'ml', 'chicken stock'), ['≈ 1 pt', '2⅛ cups', '17 fl oz', '0.5 l', '≈ 500 g (weight)']);
eq('scaled ×2 and ranges', [B(1, 'cup', 'rice', 2), B(1, 'cup', 'rice', 1, 1.5)],
  [['1 pt', '16 fl oz', '32 tbsp', '473 ml'], ['8–12 fl oz', '16–24 tbsp', '237–355 ml']]);
eq('big amounts drop spoon counts; litres and kilos take over', [B(6, 'cup', 'water'), B(3, 'lb', 'potatoes')],
  [['1½ qt', '3 pt', '48 fl oz', '1.42 l', '≈ 1.42 kg (weight)'], ['48 oz', '1.36 kg']]);
const amts = t => findAmounts(t).map(a => [t.slice(a.index, a.index + a.length), a.qty, a.qtyMax, a.unit]);
eq('amounts in notes', ['or ½ tsp dried', 'Diamond Crystal; use 1¼ tsp Morton', 'about 2.5 lb, patted very dry', 'juiced (about 3 tbsp)', 'one 14-oz can', '1 1/2 cups, or 2–3 Tbsp. more'].map(amts),
  [[['½ tsp', 0.5, null, 'tsp']], [['1¼ tsp', 1.25, null, 'tsp']], [['2.5 lb', 2.5, null, 'lb']], [['3 tbsp', 3, null, 'tbsp']],
   [['14-oz', 14, null, 'oz']], [['1 1/2 cups', 1.5, null, 'cups'], ['2–3 Tbsp.', 2, 3, 'Tbsp']]]);
eq('not amounts: sizes, times, temperatures, counts, cinnamon sticks', ['cut into 1-inch pieces', 'rest 10 minutes', 'at 350°F', '2 cloves', 'v2.5 lb', '1 cinnamon stick'].map(amts),
  [[], [], [], [], [], []]);
/* ---------- note amounts scale with the recipe (scaleNote) ---------- */
const SN = (note, ing, f) => {
  let out = '', pos = 0;
  for (const sp of scaleNote(note, ing, f)) { out += note.slice(pos, sp.index) + sp.label; pos = sp.index + sp.length; }
  return out + note.slice(pos);
};
const BUTTER = { qty: 113, unit: 'g', item: 'salted butter' }, TAILS = { qty: 2, unit: null, item: 'raw lobster tails' };
eq('measures in a note scale, unit words follow the amount', [
  SN('1 stick, melted; with unsalted, add 1.5 g more salt', BUTTER, 2),
  SN('melted and cooled until warm (1 stick + 3 tbsp)', { qty: 11, unit: 'tbsp', item: 'unsalted butter' }, 1.5),
  SN('with its juices (about 1 cup packed / 340 g)', { qty: 0.75, unit: 'lb', item: 'kimchi' }, 2),
  SN('divided: 2 tbsp for the Spam, 1 tbsp for the eggs', { qty: 3, unit: 'tbsp', item: 'canola oil' }, 0.5),
  SN('loosely packed (about 20–25 g)', { qty: 0.33, unit: 'cup', item: 'Parmesan' }, 2),
  SN('or 2 cups milk', { qty: 1, unit: 'cup', item: 'cream' }, 0.5),
  SN('½ tbsp each for the steak and scallops', { qty: 1, unit: 'tbsp', item: 'unsalted butter' }, 2)
], ['2 sticks, melted; with unsalted, add 3 g more salt', 'melted and cooled until warm (1½ sticks + 4½ tbsp)',
  'with its juices (about 2 cups packed / 680 g)', 'divided: 1 tbsp for the Spam, ½ tbsp for the eggs', 'loosely packed (about 40–50 g)',
  'or 1 cup milk', '1 tbsp each for the steak and scallops']);
eq('counted things in a note scale and pluralize', [
  SN('1 can, cut into ¼- to ½-inch dice', { qty: 12, unit: 'oz', item: 'Spam' }, 2),
  SN('mild; about 2 links (8 oz), casings removed', { qty: 225, unit: 'g', item: 'Italian pork sausage' }, 1.5),
  SN('or 3 green onions; washed and sliced', { qty: 1, unit: null, item: 'large green onion (dae-pa)' }, 2),
  SN('from a large egg', { qty: 1, unit: null, item: 'egg yolk' }, 2),
  SN('from a large egg', { qty: 1, unit: null, item: 'egg yolk' }, 0.5),
  SN('a small handful, finely chopped', { qty: null, unit: null, item: 'fresh basil' }, 2),
  SN('one 14-oz can', { qty: 1.75, unit: 'cup', item: 'crushed tomatoes' }, 2),
  SN('about 8 oz, half a 16-oz package', { qty: 225, unit: 'g', item: 'silken tofu' }, 2),
  SN('2 cans, drained', { qty: 3, unit: 'cup', item: 'chickpeas' }, 0.5)
], ['2 cans, cut into ¼- to ½-inch dice', 'mild; about 3 links (12 oz), casings removed', 'or 6 green onions; washed and sliced',
  'from two large eggs', 'from half a large egg', 'two small handfuls, finely chopped', 'two 14-oz cans', 'about 16 oz, one 16-oz package',
  '1 can, drained']);
const KEEP = [
  ['4–5 oz each (shell-on weight)', TAILS], ['your blend, 1 tbsp per pound of steak', { qty: 1, unit: 'tbsp', item: 'steak seasoning' }],
  ['if salt-free, add 1½ tsp Diamond Crystal per lb', { qty: 1, unit: 'tbsp', item: 'steak seasoning' }], ['cut into 8 pieces', { qty: 1, unit: null, item: 'chicken' }],
  ['roughly chopped (a bar melts into pools; chips work)', { qty: 140, unit: 'g', item: 'bittersweet chocolate' }],
  ['one per plate', { qty: 3, unit: null, item: 'large eggs' }], ['if frozen, soak in cold water 30 minutes', { qty: 1, unit: 'lb', item: 'tteok' }],
  ['Diamond Crystal (Morton ≈ 0.6×, table salt ≈ 0.5× the volume)', { qty: null, unit: null, item: 'kosher salt' }],
  ['¼-inch coins', { qty: 4, unit: 'slice', item: 'ginger' }], ['10–12 oz and 1–1¼ inches thick, at 350°F', { qty: 1, unit: null, item: 'strip steak' }]
];
eq('sizes, rates, per-piece weights, cuts, times, ratios stay as written', KEEP.map(([n, i]) => SN(n, i, 2)),
  KEEP.map(([n]) => n.replace('10–12 oz', '20–24 oz')));
eq('why each one stays', ['4–5 oz each', 'one 14-oz can', '1 tbsp per pound'].map((n, j) => scaleNote(n, [TAILS, { unit: 'cup', item: 'tomatoes' }, { unit: 'tbsp', item: 'rub' }][j], 2)
  .filter(sp => sp.kind === 'amt').map(sp => sp.why)), [['each'], ['size'], ['rate']]);
eq('×1: every note reads exactly as written', [...KEEP.map(([n, i]) => [n, i]), ['1 stick + 3 tbsp, a small handful, 2 cans', BUTTER]].map(([n, i]) => SN(n, i, 1) === n),
  Array(KEEP.length + 1).fill(true));
eq('scaled spans carry the scaled amount for the breakdown', scaleNote('1 stick, melted', BUTTER, 2).map(sp => [sp.qty, sp.unit, sp.scaled, flat(breakdown(sp))[0]]),
  [[2, 'stick', true, '1 cup']]);
eq('1¼ tsp: no fuzzy "≈ ⅜ tbsp"; plain salt weighs 6 g/tsp', B(1.25, 'tsp', 'salt'), ['6.2 ml', '≈ 7.5 g (weight)']);
/* ---------- inline US measure for metric amounts ("10 g (1¾ tsp*)") ---------- */
const U = (qty, unit, item, extra = {}, f = 1) => usEquivalent({ qty, unit, item, ...extra }, f);
eq('grams by the ingredient’s own density', [U(10, 'g', 'fine table salt', { density: { g: 5.7, per: 'tsp' } }),
  U(20, 'g', 'parmesan', { density: { g: 80, per: 'cup' } }), U(40, 'g', 'minced chicken', { density: { g: 13.3, per: 'tbsp' } })],
  ['1¾ tsp', '¼ cup', '3 tbsp']);
eq('grams by the table: salt by brand, soy sauce, flour; unbranded kosher salt unknown',
  [U(10, 'g', 'salt'), U(6, 'g', 'kosher salt (Diamond Crystal)'), U(36, 'g', 'soy sauce'), U(125, 'g', 'all-purpose flour'), U(10, 'g', 'kosher salt')],
  ['1⅔ tsp', '2⅛ tsp', '2 tbsp', '1 cup', null]);
eq('millilitres need no density; big amounts in cups and quarts', [U(30, 'ml', 'soy sauce'), U(15, 'ml', 'water'), U(500, 'ml', 'chicken stock'), U(1, 'l', 'water')],
  ['2 tbsp', '1 tbsp', '2⅛ cups', '1 qt']);
eq('tablespoons + quarter teaspoons, scaled, ranges', [U(40, 'ml', 'water'), U(10, 'g', 'salt', { density: { g: 5.7, per: 'tsp' } }, 2),
  U(5, 'ml', 'fish sauce', { qtyMax: 10 }), U(10, 'ml', 'water', { qtyMax: 20 })],
  ['2 tbsp + 2 tsp', '1 tbsp + ½ tsp', '1–2 tsp', '2 tsp – 1 tbsp + 1 tsp']);
eq('none for: density null, unknown items, US units, counts, under ⅛ tsp', [U(200, 'g', 'all-purpose flour', { density: null }), U(200, 'g', 'rigatoni'),
  U(2, 'tbsp', 'soy sauce'), U(1, 'lb', 'butter'), U(2, null, 'eggs'), U(0.5, 'g', 'salt')],
  [null, null, null, null, null, null]);
eq('density: own value wins over the table; null turns the table off; bad values fall back',
  [gramsPerMl({ item: 'salt', density: { g: 2.8, per: 'tsp' } }).toFixed(3), gramsPerMl({ item: 'salt', density: null }),
   gramsPerMl({ item: 'salt', density: { g: 0, per: 'tsp' } }), gramsPerMl({ item: 'salt', density: { g: 5, per: 'clove' } })],
  ['0.568', null, 1.22, 1.22]);
eq('the tap breakdown uses the ingredient’s density too', flat(breakdown({ qty: 20, unit: 'g', item: 'parmesan', density: { g: 80, per: 'cup' } })),
  ['≈ ⅔ oz', '≈ ¼ cup (volume)']);
eq('T is a tablespoon, t a teaspoon; spelled-out units', ['T', 't', 'Tablespoons', 'fl. oz', 'Grams', 'pinch'].map(u => unitInfo(u)?.key ?? null),
  ['tbsp', 'tsp', 'tbsp', 'floz', 'g', null]);

/* ---------- temperatures ---------- */
const T = s => findTemps(s).map(t => [s.slice(t.index, t.index + t.length), t.lo, t.hi, t.scale, t.oven]);
eq('temperatures: symbols, spacing, words, bare F, ranges', [
  'Preheat the oven to 425°F.', 'Bake at 350 °F for 30 minutes', 'Heat the oven to 180°C (160°C fan).', 'Roast at 325–350°F',
  'Bake at 325°F to 350°F', 'Preheat oven to 400 degrees F', 'Set the oven to 250F', 'Heat to 375 F', 'Heat the oven to 220 ℃'
].map(T), [
  [['425°F', 425, null, 'F', true]], [['350 °F', 350, null, 'F', true]], [['180°C', 180, null, 'C', true], ['160°C', 160, null, 'C', true]],
  [['325–350°F', 325, 350, 'F', true]], [['325°F to 350°F', 325, 350, 'F', true]], [['400 degrees F', 400, null, 'F', true]],
  [['250F', 250, null, 'F', true]], [['375 F', 375, null, 'F', false]], [['220 ℃', 220, null, 'C', true]]
]);
eq('oven settings vs internal / oil temperatures', [
  'Roast in a 250°F oven until it reads 125°F inside.', 'Heat the oil to 350°F in a Dutch oven.', 'Pull at 130 °F for medium-rare.'
].map(T), [
  [['250°F', 250, null, 'F', true], ['125°F', 125, null, 'F', false]], [['350°F', 350, null, 'F', false]], [['130 °F', 130, null, 'F', false]]
]);
eq('a written-out conversion is not a second link', ['Preheat the oven to 425°F (220°C).', 'Bake at 350°F/175°C', 'Cook to 130°F (about 54°C), then rest'].map(T),
  [[['425°F', 425, null, 'F', true]], [['350°F', 350, null, 'F', true]], [['130°F', 130, null, 'F', false]]]);
eq('a change in temperature converts as a difference', [
  findTemps('Lower the oven by 25°F for convection.').map(t => [t.lo, t.delta, t.oven]), findTemps('It climbs about 10°F as it rests.').map(t => t.delta),
  findTemps('Run it 15°F hotter next time.').map(t => t.delta), tempDetails({ lo: 25, scale: 'F', delta: true })
], [[[25, true, false]], [true], [true], { main: '14°C', lines: ['A change in temperature, not a reading'] }]);
eq('not temperatures: cups, turns, calories, pan sizes', ['Add 2 C flour', 'Add 12 C water', 'Rotate the pan 180° and cook', 'about 100 Calories', 'a 9x13 pan', 'use 20 Fl oz'].map(T),
  [[], [], [], [], [], []]);
eq('oven °F: °C, oven dial, fan, convection', tempDetails({ lo: 350, scale: 'F', oven: true }),
  { main: '177°C', lines: ['Oven dial ≈ 180°C · fan 160°C', 'Convection: 325°F'] });
eq('oven °C: °F dial and convection, fan', tempDetails({ lo: 200, scale: 'C', oven: true }),
  { main: '392°F', lines: ['Oven dial ≈ 400°F · convection 375°F', 'Fan oven: 180°C'] });
eq('food temperatures: just the other scale; ranges', [tempDetails({ lo: 125, scale: 'F' }), tempDetails({ lo: 325, hi: 350, scale: 'F' })],
  [{ main: '52°C', lines: [] }, { main: '163–177°C', lines: [] }]);

/* ---------- DOM: row taps, amount panels, mention bubble ---------- */
const recipe = { slug: 'zz-test', ingredients: CHICKEN, steps: [] };
const box = document.querySelector('#sandbox');
box.innerHTML = `<div data-ingredients>${toStr(ingredientsHtml(recipe, 'zz-test'))}</div><p class="rx-step-text">${stepHtml}</p>`;
const offIng = bindIngredients(box, recipe, 'zz-test');
const offMen = bindMentions(box, () => recipe, 'zz-test');
const row = [...box.querySelectorAll('.rx-ing')].find(r => r.querySelector('[data-ing="i8"]'));
const cb = row.querySelector('.rx-ing-input');
row.querySelector('.rx-ing-item').click();
truthy('tapping the ingredient name checks it', cb.checked && row.classList.contains('is-checked'));
row.querySelector('.rx-ing-note').click();
truthy('tapping the note unchecks it', !cb.checked && !row.classList.contains('is-checked'));
row.querySelector('.rx-check-hit').click();
truthy('tapping the circle checks it', cb.checked && row.classList.contains('is-checked'));
row.querySelector('.rx-check-hit').click();
const qb = row.querySelector('[data-conv="i8"]'), panel = row.querySelector('#rx-conv-i8');
truthy('convertible amount is a button, panel starts hidden', qb && qb.textContent === '3 tbsp' && panel.hidden);
qb.click();
truthy('tap amount → breakdown with Imperial and Metric lists', !panel.hidden && qb.getAttribute('aria-expanded') === 'true'
  && /Imperial/.test(panel.textContent) && /Metric/.test(panel.textContent) && /9 tsp/.test(panel.textContent) && /44 ml/.test(panel.textContent) && !cb.checked, panel.textContent);
panel.querySelector('li').click();
truthy('tapping inside the breakdown leaves the checkbox alone', !cb.checked && !panel.hidden);
qb.click();
truthy('tap again → closed', panel.hidden && qb.getAttribute('aria-expanded') === 'false');
const thyme = [...box.querySelectorAll('.rx-ing')].find(r => r.querySelector('[data-ing="i9"]'));
const nb = thyme.querySelector('[data-conv="i9-n0"]'), np = thyme.querySelector('#rx-conv-i9-n0');
truthy('amount in a note ("or ½ tsp dried") is its own button', nb && nb.textContent === '½ tsp' && np.hidden && !thyme.querySelector('[data-conv="i9"]'));
nb.click();
truthy('tap note amount → its breakdown, checkbox untouched', !np.hidden && /2\.5 ml/.test(np.textContent) && /½ tsp/.test(np.querySelector('.rx-conv-cap')?.textContent || '')
  && !thyme.querySelector('.rx-ing-input').checked, np.textContent);
const chick = [...box.querySelectorAll('.rx-ing')].find(r => r.querySelector('[data-ing="i1"]'));
chick.querySelector('[data-conv="i1-n0"]').click();
truthy('"about 2.5 lb" in a note → 2 lb 8 oz / 1.13 kg', /2 lb 8 oz/.test(chick.querySelector('#rx-conv-i1-n0').textContent) && /1\.13 kg/.test(chick.querySelector('#rx-conv-i1-n0').textContent));
truthy('counts ("6") and cloves stay plain text', !box.querySelector('[data-conv="i1"]') && !box.querySelector('[data-conv="i5"]'));

const link = box.querySelector('[data-ingref="i5"]');
link.scrollIntoView({ block: 'center' });
link.click();
let tip = document.querySelector('.rx-ingtip');
const gap = tip && link.getBoundingClientRect().top - tip.getBoundingClientRect().bottom;
truthy('tap step ingredient → bubble right above it with the amount', tip && /4 cloves/.test(tip.textContent) && /garlic/.test(tip.textContent)
  && link.getAttribute('aria-expanded') === 'true' && gap >= 0 && gap <= 12, `${tip?.textContent} gap ${gap}`);
const down = el => el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
down(tip);
truthy('touching the bubble itself keeps it', document.querySelector('.rx-ingtip'));
down(box.querySelector('.rx-ing-note'));
truthy('touching anywhere else closes it (pointerdown: iOS sends no click for plain text)', !document.querySelector('.rx-ingtip') && link.getAttribute('aria-expanded') === 'false');
link.click(); link.click();
truthy('tapping the same word again closes it', !document.querySelector('.rx-ingtip'));
const bare = document.createElement('p');
bare.innerHTML = toStr(stepTextHtml({ id: 's8', text: 'Melt the butter.', timers: [] }, 8, { match: mentionMatcher(CHICKEN) }));
document.body.append(bare);
bare.scrollIntoView({ block: 'center' });
bare.querySelector('[data-ingref]').click();
truthy('works without any view binding (amounts ride in the button)', /3 tbsp/.test(document.querySelector('.rx-ingtip')?.textContent || ''));
bare.remove();
await new Promise(r => setTimeout(r, 0));
link.scrollIntoView({ block: 'center' });
truthy('word removed from the page → bubble goes too', !document.querySelector('.rx-ingtip'));
link.click();
window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
truthy('Escape closes it', !document.querySelector('.rx-ingtip'));

const tp = document.createElement('p');
tp.innerHTML = toStr(stepTextHtml({ id: 's9', text: 'Preheat the oven to 425°F. Melt the butter.', timers: [] }, 9, { match: mentionMatcher(CHICKEN) }));
document.body.append(tp);
tp.scrollIntoView({ block: 'center' });
const tb = tp.querySelector('[data-temp]');
truthy('a step temperature is a button, next to ingredient links', tb?.textContent.startsWith('425°F') && tp.querySelector('[data-ingref]'));
tb.click();
const tipText = document.querySelector('.rx-ingtip')?.textContent || '';
truthy('tap → °C plus oven dial, fan and convection', /218°C/.test(tipText) && /220°C · fan 200°C/.test(tipText) && /Convection: 400°F/.test(tipText), tipText);
tb.click();
truthy('tap again closes it', !document.querySelector('.rx-ingtip'));
tp.remove();
const noteBox = document.createElement('div');
noteBox.innerHTML = toStr(ingredientsHtml({ ingredients: [{ id: 'i1', qty: 2, unit: 'tbsp', item: 'butter', note: 'softened, about 65°F' },
  { id: 'i2', qty: 1, unit: 'cup', item: 'water', note: 'warmed to 40C; or 2 tbsp milk' }] }, 'zz-temp'));
truthy('note temperatures link; "40C" is not 40 cups', noteBox.querySelectorAll('[data-temp]').length === 2 && noteBox.querySelectorAll('.rx-note-amt').length === 1
  && noteBox.querySelector('.rx-note-amt').textContent === '2 tbsp');
rxPatch('zz-scale', { factor: 2 });
const scaleBox = document.createElement('div');
scaleBox.innerHTML = toStr(ingredientsHtml({ ingredients: [{ id: 'i1', ...BUTTER, note: '1 stick, melted; 1 can of anything' },
  { id: 'i2', ...TAILS, note: '4–5 oz each' }] }, 'zz-scale'));
const sAmt = scaleBox.querySelector('[data-conv="i1-n0"]'), sCap = scaleBox.querySelector('#rx-conv-i1-n0 .rx-conv-cap');
truthy('×2 on the page: "1 stick" → "2 sticks", accent, its breakdown for 2 sticks', sAmt?.textContent === '2 sticks' && sAmt.classList.contains('is-scaled')
  && sCap?.textContent === '2 sticks' && /1 cup/.test(scaleBox.querySelector('#rx-conv-i1-n0').textContent), sAmt?.textContent);
truthy('×2 on the page: "1 can" → "2 cans" in accent spans', [...scaleBox.querySelectorAll('.rx-note-count.is-scaled')].map(e => e.textContent).join(' ') === '2 cans'
  && /2 cans of anything/.test(scaleBox.querySelector('.rx-ing-note').textContent));
const kept = scaleBox.querySelector('[data-conv="i2-n0"]');
truthy('a per-piece weight stays, not accented, and its breakdown says why', kept?.textContent === '4–5 oz' && !kept.classList.contains('is-scaled')
  && scaleBox.querySelector('#rx-conv-i2-n0 .rx-conv-cap')?.textContent === '4–5 oz — per piece, not scaled');
sessionStorage.removeItem('bb.rx:zz-scale');
const metricBox = document.createElement('div');
const METRIC_RX = { ingredients: [{ id: 'i1', qty: 10, unit: 'g', density: { g: 5.7, per: 'tsp' }, item: 'fine table salt', note: null },
  { id: 'i2', qty: 200, unit: 'g', density: null, item: 'rigatoni', note: null }, { id: 'i3', qty: 2, unit: 'tbsp', item: 'olive oil', note: null }] };
metricBox.innerHTML = `<div data-ingredients>${toStr(ingredientsHtml(METRIC_RX, 'zz-metric'))}</div>`;
const approxOf = () => [...metricBox.querySelectorAll('.rx-ing')].map(r => r.querySelector('.rx-approx')?.textContent.replace('approximately', '~') ?? null);
eq('metric amount → US measure with * inline; none for density null or US units', approxOf(), ['(1¾ tsp*, ~)', null, null]);
truthy('a key under the list explains the *', /\* Approximate US measure/.test(metricBox.querySelector('.rx-approx-key')?.textContent || ''));
rxPatch('zz-metric', { factor: 2 });
metricBox.innerHTML = `<div data-ingredients>${toStr(ingredientsHtml(METRIC_RX, 'zz-metric'))}</div>`;
eq('the US measure scales with the servings', approxOf()[0], '(1 tbsp + ½ tsp*, ~)');
sessionStorage.removeItem('bb.rx:zz-metric');
const usOnly = document.createElement('div');
usOnly.innerHTML = toStr(ingredientsHtml({ ingredients: [METRIC_RX.ingredients[2]] }, 'zz-us'));
truthy('no metric amounts → no key', !usOnly.querySelector('.rx-approx-key'));
const saltStep = document.createElement('p');
saltStep.innerHTML = toStr(stepTextHtml({ id: 's1', text: 'Season the water with the salt.', timers: [] }, 1, { match: mentionMatcher(METRIC_RX.ingredients) }));
document.body.append(saltStep);
saltStep.scrollIntoView({ block: 'center' });
saltStep.querySelector('[data-ingref]')?.click();
truthy('a step mention’s bubble carries the US measure too', /10 g \(1¾ tsp\*\) fine table salt/.test(document.querySelector('.rx-ingtip')?.textContent || ''),
  document.querySelector('.rx-ingtip')?.textContent);
window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));
saltStep.remove();
// Cook mode's Ingredients sheet: the same list inside a sheet (z 60) — the bubble must show above it.
const done = sheet({ title: 'Ingredients', body: noteBox });
const wrap = document.querySelector('.sheet-backdrop:last-of-type');
wrap.classList.add('open'); wrap.querySelector('.sheet').style.transition = 'none';
const st = noteBox.querySelector('[data-temp]');
st.click();
const inTip = document.querySelector('.rx-ingtip'), tr = inTip?.getBoundingClientRect();
const hit = tr && document.elementFromPoint(tr.left + tr.width / 2, tr.top + tr.height / 2);
truthy('a temperature tapped inside a sheet: its bubble shows on top of the sheet', inTip && inTip.contains(hit), `on top: ${hit?.className}`);
window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));     // closes the bubble…
document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }));   // …then the sheet
await done;
offIng(); offMen();
box.remove();
sessionStorage.removeItem('bb.rx:zz-test');

const failed = results.filter(r => !r.ok).length;
document.querySelector('#view').innerHTML = `
  <p class="t-sum ${failed ? 'bad' : 'good'}">${results.length - failed}/${results.length} passed</p>
  <table>${results.map(r => `<tr class="${r.ok ? 'pass' : 'fail'}"><td>${r.ok ? '✓' : '✗'}</td><td>${r.name.replace(/</g, '&lt;')}${r.detail ? `<br><small>${r.detail.replace(/</g, '&lt;')}</small>` : ''}</td></tr>`).join('')}</table>`;
</script>
</body>
</html>
