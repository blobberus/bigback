<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>util.js tests · Bigback</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body { padding-bottom: 24px; }
    .t-sum { font-weight: 700; margin: 0 0 12px; }
    .t-sum.bad { color: var(--danger); } .t-sum.good { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    td:first-child { width: 2.5em; font-weight: 800; }
    tr.pass td:first-child { color: var(--ok); } tr.fail td:first-child { color: var(--danger); }
    pre { margin: 4px 0 0; white-space: pre-wrap; word-break: break-word; font: .75rem/1.4 var(--font-mono); color: var(--ink-2); }
  </style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/util.html -->
<main id="view"><p class="muted">Running…</p></main>
<script type="module">
import { parseDurations, fmtQty, scaleQty, slugify, localDay, takenOn } from '../js/util.js';
import { cookLog, cookedLine, photoDay } from '../js/components/recipe-journal.js';

const results = [];
const canon = v => JSON.stringify(v, (k, x) => (x && typeof x === 'object' && !Array.isArray(x)
  ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x));
function eq(name, got, want) {
  const ok = canon(got) === canon(want);
  results.push({ name, ok, got, want });
  // one line, and wording smoke.py recognizes ("failed"), so a failure fails the smoke run
  if (!ok) console.error(`Test failed: ${name} | want ${canon(want)} | got ${canon(got)}`);
}
const secs = text => parseDurations(text).map(d => [d.seconds, d.maxSeconds]);

/* ---------- parseDurations ---------- */
eq('en-dash range: full result shape', parseDurations('Simmer 10–15 minutes, stirring.'),
  [{ seconds: 600, maxSeconds: 900, label: '10–15 minutes', index: 7, length: 13 }]);
eq('hours + minutes add up', ['1 hr 30 min', 'Roast 1 hour and 20 minutes', 'Braise 2 hours 15 mins'].map(secs),
  [[[5400, null]], [[4800, null]], [[8100, null]]]);
eq('"to" / hyphen ranges, incl. a fractional upper bound', ['Braise 2 to 3 hours', 'Bake 25-30 min', 'Rest 1–1½ hours'].map(secs),
  [[[7200, 10800]], [[1500, 1800]], [[3600, 5400]]]);
eq('word numbers and articles', ['Let it rest for a minute', 'Chill an hour', 'Steep five minutes', 'Microwave thirty seconds'].map(secs),
  [[[60, null]], [[3600, null]], [[300, null]], [[30, null]]]);
eq('"forty-five minutes" is 45 minutes, not a 40→5 range', secs('Bake forty-five minutes'), [[2700, null]]);
eq('compound word numbers (hyphen or space)', ['Roast twenty-five minutes', 'Braise thirty five minutes', 'Proof ninety minutes'].map(secs),
  [[[1500, null]], [[2100, null]], [[5400, null]]]);
eq('word range still works', secs('Simmer twenty to thirty minutes'), [[1200, 1800]]);
eq('decimals (dot and comma)', ['Cook 1.5 hours', 'Blanch 2,5 min'].map(secs), [[[5400, null]], [[150, null]]]);
eq('unicode fractions', ['Rest ½ hour', 'Let rise 1½ hours', '¾ hour in the fridge'].map(secs),
  [[[1800, null]], [[5400, null]], [[2700, null]]]);
eq('attached short units', secs('Sear 2m per side, rest 30s, then 1h in the oven'), [[120, null], [30, null], [3600, null]]);
eq('several durations keep their positions', parseDurations('Simmer 20 minutes, then bake 1 hour.').map(d => [d.seconds, d.index, d.label]),
  [[1200, 7, '20 minutes'], [3600, 29, '1 hour']]);
eq('no false positives', ['Preheat the oven to 400°F', 'Roll to 5 mm thick', 'Cut into 2 cm pieces', 'Add 2 sprigs thyme',
  'Simmer for a few minutes', '', null].map(t => parseDurations(t).length), [0, 0, 0, 0, 0, 0, 0]);

/* ---------- fmtQty ---------- */
eq('common cooking fractions', [1.5, 0.333, 0.25, 0.75, 2 / 3, 0.125, 1.333, 2.375].map(fmtQty), ['1½', '⅓', '¼', '¾', '⅔', '⅛', '1⅓', '2⅜']);
eq('whole numbers; near-whole values snap', [12, 2, 2.01, 1.99, 0].map(fmtQty), ['12', '2', '2', '2', '0']);
eq('decimals with no close fraction stay decimal', [2.2, 0.45, 1.06].map(fmtQty), ['2.2', '0.45', '1.06']);
eq('numeric strings', ['1.5', '3', '0.5'].map(fmtQty), ['1½', '3', '½']);
eq('empty / invalid → ""', [null, undefined, '', 'abc', NaN].map(fmtQty), ['', '', '', '', '']);

/* ---------- scaleQty ---------- */
eq('small quantities keep 2 decimals', [scaleQty(2, 1.5), scaleQty(1 / 3, 2), scaleQty(0.25, 0.5), scaleQty(0.333, 1)], [3, 0.67, 0.13, 0.33]);
eq('10 and over rounds to the nearest half', [scaleQty(7, 1.5), scaleQty(8, 1.3), scaleQty(12, 1.25), scaleQty(500, 1.5)], [10.5, 10.5, 15, 750]);
eq('scaled values format as clean fractions', [scaleQty(1 / 3, 2), scaleQty(1.5, 0.5), scaleQty(0.75, 2), scaleQty(1, 2 / 3), scaleQty(1 / 3, 3)].map(fmtQty),
  ['⅔', '¾', '1½', '⅔', '1']);
// same display rule as components/recipe-ingredients.js: scale qty and qtyMax, collapse when equal
const amount = (ing, f) => {
  const lo = scaleQty(ing.qty, f), hi = ing.qtyMax != null ? scaleQty(ing.qtyMax, f) : null;
  return hi != null && hi !== lo ? `${fmtQty(lo)}–${fmtQty(hi)}` : fmtQty(lo);
};
eq('ranges (qty–qtyMax) scale both ends', [amount({ qty: 2, qtyMax: 3 }, 2), amount({ qty: 0.5, qtyMax: 0.75 }, 2), amount({ qty: 10, qtyMax: 12 }, 1.5),
  amount({ qty: 1, qtyMax: null }, 0.5)], ['4–6', '1–1½', '15–18', '½']);
eq('non-numeric passes through; numeric strings scale', [scaleQty(null, 2), scaleQty('', 2), scaleQty('abc', 2), scaleQty('2', 2)], [null, '', 'abc', 4]);

/* ---------- slugify ---------- */
eq('plain title', slugify('Crispy Skillet Chicken Thighs'), 'crispy-skillet-chicken-thighs');
eq('accents and ligatures fold to ASCII', ['Crème Brûlée', 'Jalapeño Poppers', 'Phở Bò', 'ﬁsh tacos', 'Käsespätzle'].map(slugify),
  ['creme-brulee', 'jalapeno-poppers', 'pho-bo', 'fish-tacos', 'kasespatzle']);
eq('"&" becomes "and"; punctuation collapses to one hyphen', ['Mac & Cheese', 'Pad Thai (Street-Style) — 15 min', '  Shrimp...and Grits!!  '].map(slugify),
  ['mac-and-cheese', 'pad-thai-street-style-15-min', 'shrimp-and-grits']);
eq('apostrophe splits the word (current behaviour)', slugify('Grandma’s Sunday Gravy'), 'grandma-s-sunday-gravy');
eq('nothing usable → "recipe"', ['', null, undefined, '!!!', '麻婆豆腐'].map(slugify), ['recipe', 'recipe', 'recipe', 'recipe', 'recipe']);
const LONG = ['Weeknight Chicken Tikka Masala with Garlic Butter Naan plus Rice', 'Grandmas Sunday Lasagna with Three Cheeses and Slow Simmered Meat Sauce'];
eq('long titles: ≤ 60 chars, valid kebab-case (no trailing hyphen)', LONG.map(t => { const s = slugify(t); return [s, s.length <= 60 && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(s)]; }),
  [['weeknight-chicken-tikka-masala-with-garlic-butter-naan-plus', true], ['grandmas-sunday-lasagna-with-three-cheeses-and-slow-simmered', true]]);

/* ---------- takenOn: the photo's own date (EXIF) ---------- */
// A minimal JPEG: SOI, APP1 "Exif" with a TIFF block (IFD0 → Exif IFD), then SOS.
function exifJpeg({ le = false, original = null, dateTime = null } = {}) {
  const buf = new ArrayBuffer(208), v = new DataView(buf), t = 12;
  const u16 = (p, x) => v.setUint16(t + p, x, le), u32 = (p, x) => v.setUint32(t + p, x, le);
  const str = (p, s) => { [...s].forEach((c, i) => v.setUint8(t + p + i, c.charCodeAt(0))); v.setUint8(t + p + s.length, 0); };
  v.setUint16(0, 0xFFD8); v.setUint16(2, 0xFFE1); v.setUint16(4, 198); v.setUint32(6, 0x45786966);
  v.setUint16(t, le ? 0x4949 : 0x4D4D); u16(2, 42); u32(4, 8);
  const ifd0 = [];
  if (dateTime) ifd0.push([0x0132, 2, 20, 120]);
  if (original) ifd0.push([0x8769, 4, 1, 60]);
  u16(8, ifd0.length);
  ifd0.forEach(([tag, type, n, val], k) => { const at = 10 + k * 12; u16(at, tag); u16(at + 2, type); u32(at + 4, n); u32(at + 8, val); });
  if (dateTime) str(120, dateTime);
  if (original) { u16(60, 1); u16(62, 0x9003); u16(64, 2); u32(66, 20); u32(70, 150); str(150, original); }
  v.setUint16(202, 0xFFDA);
  return new Blob([buf], { type: 'image/jpeg' });
}
const jfif = new Uint8Array([0xFF, 0xD8, 0xFF, 0xE0, 0x00, 0x10, 0x4A, 0x46, 0x49, 0x46, 0, 1, 1, 0, 0, 1, 0, 1, 0, 0]);
const png = new Blob([new Uint8Array([0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A, 0, 0, 0, 0])], { type: 'image/png' });
eq('EXIF date taken: big-endian, little-endian, DateTimeOriginal over DateTime, IFD0 fallback, after a JFIF segment', await Promise.all([
  takenOn(exifJpeg({ original: '2026:10:03 18:42:11' })),
  takenOn(exifJpeg({ le: true, original: '2025:12:31 23:59:59', dateTime: '2026:01:05 08:00:00' })),
  takenOn(exifJpeg({ le: true, dateTime: '2026:07:04 12:00:00' })),
  takenOn(new Blob([jfif, (await exifJpeg({ original: '2026:09:09 09:09:09' }).arrayBuffer()).slice(2)]))
]), ['2026-10-03', '2025-12-31', '2026-07-04', '2026-09-09']);
eq('no usable date → null (no EXIF, zeroed clock, PNG, empty, truncated)', await Promise.all([
  takenOn(exifJpeg()), takenOn(exifJpeg({ original: '0000:00:00 00:00:00' })), takenOn(png), takenOn(new Blob([])),
  takenOn(exifJpeg({ original: '2026:10:03 18:42:11' }).slice(0, 40))
]), [null, null, null, null, null]);
eq('localDay is the phone\'s own calendar day', localDay(new Date(2026, 0, 5, 23, 30)), '2026-01-05');

/* ---------- cook log: days with journal photos ---------- */
const at = '2026-11-12T15:00:00Z';
const J = [
  { id: 'p1', kind: 'photo', photo: 'media/x/journal/p1.jpg', cookedOn: '2026-11-10', createdAt: '2026-11-13T01:00:00Z' },
  { id: 'p2', kind: 'photo', photo: 'media/x/journal/p2.jpg', cookedOn: '2026-11-10', createdAt: '2026-11-13T01:05:00Z' },
  { id: 'p3', kind: 'photo', photo: 'media/x/journal/p3.jpg', createdAt: at },
  { id: 'p4', kind: 'photo', photo: 'media/x/journal/p4.jpg', cookedOn: 'yesterday', createdAt: at },
  { id: 'n1', kind: 'note', photo: null, text: 'Too salty', createdAt: '2026-11-14T10:00:00Z' },
  { id: 'p5', kind: 'photo', photo: null, createdAt: '2026-11-14T10:00:00Z' }
];
eq('photoDay: cookedOn, else the upload\'s local day (bad cookedOn ignored)', J.slice(0, 4).map(photoDay),
  ['2026-11-10', '2026-11-10', localDay(new Date(at)), localDay(new Date(at))]);
eq('cookLog: one cook per day with a photo; notes and photo-less entries ignored', cookLog(J), { count: 2, last: localDay(new Date(at)) });
eq('cookedLine', [cookedLine([]), cookedLine(undefined), cookedLine(J.slice(0, 2)).replace(/last .*/, 'last …')],
  ['Not cooked yet', 'Not cooked yet', 'Cooked 1× · last …']);

/* ---------- render ---------- */
const pass = results.filter(r => r.ok).length, fail = results.length - pass;
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
document.title = `${fail ? '✗' : '✓'} ${pass}/${results.length} · util`;
document.getElementById('view').innerHTML = `
  <h1>util.js tests</h1>
  <p class="t-sum ${fail ? 'bad' : 'good'}">${pass} passed · ${fail} failed</p>
  <table><tbody>${results.map(r => `<tr class="${r.ok ? 'pass' : 'fail'}"><td>${r.ok ? 'ok' : 'FAIL'}</td><td>${esc(r.name)}${r.ok ? '' :
    `<pre>want ${esc(canon(r.want))}\ngot  ${esc(canon(r.got))}</pre>`}</td></tr>`).join('')}</tbody></table>`;
</script>
</body>
</html>
