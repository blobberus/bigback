<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library order · Bigback</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/library.css">
  <style>td { padding: 4px 8px; border-top: 1px solid var(--line); font-size: .85rem; }</style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/library.html -->
<main id="view"><p class="muted">Running…</p></main>
<!-- Smooth scrolling needs real time: this holds smoke.py's DOM dump until the release below. -->
<img hidden alt="" src="/__smoke/hold">
<script type="module">
import { orderRows } from '../js/views/library.js';
import { entryFor } from '../js/store.js';

const results = [];
const canon = v => JSON.stringify(v);
function eq(name, got, want) {
  const ok = canon(got) === canon(want);
  results.push({ name, ok, detail: ok ? '' : `want ${canon(want)} got ${canon(got)}` });
  if (!ok) console.error(`Test failed: ${name} | want ${canon(want)} | got ${canon(got)}`);
}

const row = (slug, title, ts, e = {}) => ({ r: { slug, title }, e: { tags: [], rating: null, proficiency: null, pinnedAt: null, ...e }, t: null, pos: null, ts });
const rows = [
  row('a', 'Alfredo', 3), row('b', 'Banana bread', 5, { pinnedAt: '2026-11-15T10:00:00Z', rating: 6 }),
  row('c', 'Carbonara', 1, { rating: 9 }), row('d', 'Dumplings', 4, { pinnedAt: '2026-11-15T09:00:00Z', rating: 8 })
];
const slugs = list => list.map(x => x.r.slug);
eq('pinned recipes come first, each group in the chosen sort', [slugs(orderRows(rows, 'recent')), slugs(orderRows(rows, 'title')), slugs(orderRows(rows, 'rating'))],
  [['b', 'd', 'a', 'c'], ['b', 'd', 'a', 'c'], ['d', 'b', 'c', 'a']]);
eq('a playlist keeps its own order (no pin grouping)', slugs(orderRows(rows, 'title', false)), ['a', 'b', 'c', 'd']);
eq('no pins → plain sort', slugs(orderRows(rows.map(x => ({ ...x, e: { ...x.e, pinnedAt: null } })), 'recent')), ['b', 'd', 'a', 'c']);
eq('unknown sort falls back to recently added', slugs(orderRows(rows, 'nope')), ['b', 'd', 'a', 'c']);
eq('library entries default to not pinned', [entryFor({ recipes: {} }, 'x').pinnedAt, entryFor({ recipes: { x: { pinnedAt: 'T' } } }, 'x').pinnedAt], [null, 'T']);

/* ---------- the list itself, in a 390px frame of the app ---------- */
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 4000) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) { try { if (fn()) return true; } catch { /* not there yet */ } await wait(25); }
  return false;
}
try {
  const f = document.createElement('iframe');
  f.style.cssText = 'width:390px;height:700px;border:1px solid var(--line)';
  f.src = '../index.html#/';
  document.body.append(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  const d = f.contentDocument;
  await until(() => d.querySelector('#view .rcard'));
  d.querySelector('#view [data-act="filters"]').click();
  await until(() => d.querySelector('.filter-sheet [data-f="rating"]'));
  const chip = d.querySelector('.filter-sheet [data-f="rating"][data-v="unrated"]');
  chip.focus(); chip.click();
  const a = d.activeElement;
  eq('Filters sheet: toggling a chip keeps keyboard focus on it (re-rendered)', [a?.dataset?.f, a?.dataset?.v, a?.getAttribute('aria-pressed')], ['rating', 'unrated', 'true']);
  f.remove();
} catch (e) { eq('app frame ran', String(e), ''); }

/* ---------- the list view itself, on fixture data (many tags: the quick-chip row scrolls) ---------- */
const TAGS = ['alpha', 'bravo', 'charlie', 'delta', 'echo', 'foxtrot', 'golf', 'hotel'];
const FIX = {
  'recipes/index.json': { pending: [], recipes: TAGS.map((t, i) => ({ slug: `r-${t}`, title: `Recipe ${t}`, summary: '', image: null, time: {},
    servings: 2, status: i % 3 ? 'built' : 'custom', sourceType: 'custom', updatedAt: `2026-11-0${i + 1}T00:00:00Z`, openNotes: 0 })) },
  'data/library.json': { schemaVersion: 1, playlists: [], recipes: Object.fromEntries(TAGS.map((t, i) => [`r-${t}`, { tags: TAGS.slice(i), rating: null, proficiency: null }])) }
};
// A 390px frame (phone media queries) running the view itself on the fixture; it shares this page's base URL.
const fx = document.createElement('iframe');
fx.style.cssText = 'width:390px;height:600px;border:1px solid var(--line)';
fx.srcdoc = `<link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/library.css">
<main id="view"></main><script type="module">
const FIX = ${JSON.stringify(FIX)};
const realFetch = window.fetch;
window.fetch = (u, o) => { const k = Object.keys(FIX).find(p => String(u).includes(p)); return k ? Promise.resolve(new Response(JSON.stringify(FIX[k]))) : realFetch(u, o); };
history.replaceState = () => {};   // about:srcdoc can't take the view's #/?… URL; the hash sync isn't under test here
const { render } = await import('../js/views/library.js');
window.offLib = await render(document.getElementById('view'), { query: new URLSearchParams() });
<\/script>`;
document.body.append(fx);
try {
  await new Promise(r => fx.addEventListener('load', r, { once: true }));
  await until(() => fx.contentWindow.offLib);
  const chipRow = fx.contentDocument.querySelector('.qchips');
  chipRow.scrollLeft = chipRow.scrollWidth;
  const lastChip = [...chipRow.querySelectorAll('[data-act="add"]')].at(-1);
  const { k, v } = lastChip.dataset;
  lastChip.click();
  await wait(700);                                  // smooth scroll
  const on = chipRow.querySelector(`[data-act="rm"][data-k="${k}"][data-v="${v}"]`);
  const rr = chipRow.getBoundingClientRect(), cr = on?.getBoundingClientRect();
  eq(`a chip tapped at the end of the scrolled row ("${lastChip.textContent}") is in view as an active filter`,
    [chipRow.scrollWidth > chipRow.clientWidth, !!cr && cr.left >= rr.left - 1 && cr.right <= rr.right + 1], [true, true]);
} catch (e) { eq('list view ran', String(e.stack || e), ''); }
finally { fx.contentWindow?.offLib?.(); fx.remove(); }

const failed = results.filter(r => !r.ok).length;
document.querySelector('#view').innerHTML = `<p><strong>${results.length - failed}/${results.length} passed</strong></p><table>${results.map(r =>
  `<tr><td>${r.ok ? '✓' : '✗'}</td><td>${r.name}${r.detail ? ` — ${r.detail}` : ''}</td></tr>`).join('')}</table>`;
fetch('/__smoke/release');
</script>
</body>
</html>
