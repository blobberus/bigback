<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Long session · Bigback</title>
  <link rel="stylesheet" href="../css/base.css">
  <style>
    body { padding-bottom: 24px; }
    .t-sum { font-weight: 700; margin: 0 0 12px; }
    .t-sum.bad { color: var(--danger); } .t-sum.good { color: var(--ok); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
    td:first-child { width: 2.5em; font-weight: 800; }
    tr.pass td:first-child { color: var(--ok); } tr.fail td:first-child { color: var(--danger); }
    #frames iframe { display: block; width: 390px; height: 700px; border: 1px solid var(--line); margin: 8px 0; }
  </style>
</head>
<body>
<!-- Run: python scripts/smoke.py tests/long-session.html
     One long phone session in the real app (a 390px frame, no token, so nothing is written): several
     rounds through every page, with sheets opened and dismissed every way (Esc, a tap outside, their
     buttons, closed while the keyboard is up), fields typed into with the on-screen keyboard up (a faked
     visual viewport, as on iOS), ingredient and temperature bubbles tapped at the top and bottom of the
     screen, cook mode, timers, an app switch, and the iOS state where the screen and the page's layout
     viewport drift apart.
     After every round nothing may linger: the bottom nav sits on the screen's bottom edge, visible and
     tappable; no scroll lock, inert, keyboard or drift state; no orphan sheets or bubbles; the DOM
     doesn't grow. And nothing in the app may make iOS zoom the page (a zoomed page carries the nav off
     the screen's edge): every form field is ≥ 16px, and double-tap zoom is off. -->
<main id="view"><p class="muted">Running…</p></main>
<!-- Sheets, frames and timers need real time: this holds smoke.py's DOM dump until the release below. -->
<img hidden alt="" src="/__smoke/hold">
<div id="frames"></div>
<script type="module">
const SLUG = 'pan-seared-chicken';
const ROUNDS = 3;
const results = [];
const ok = (name, cond, detail = '') => { results.push({ name, ok: !!cond, detail: cond ? '' : detail }); if (!cond) console.error(`Test failed: ${name} ${detail}`); };
/* The rounds repeat the same checks: each is reported once, with the first round it failed in. */
const checks = new Map();
let round = 0;
function check(name, cond, detail = '') {
  const c = checks.get(name) || { n: 0, fail: null };
  c.n++;
  if (!cond && !c.fail) c.fail = `round ${round}: ${detail}`;
  checks.set(name, c);
  return !!cond;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 4000) {
  const t0 = performance.now();
  while (performance.now() - t0 < ms) { try { if (fn()) return true; } catch { /* not there yet */ } await wait(20); }
  return false;
}

try {
  const f = document.createElement('iframe');
  f.src = '../index.html#/';
  document.getElementById('frames').append(f);
  await new Promise(r => f.addEventListener('load', r, { once: true }));
  const w = f.contentWindow, d = f.contentDocument, de = d.documentElement, vvp = w.visualViewport;
  w.sessionStorage.clear();
  const $ = s => d.querySelector(s), $$ = s => [...d.querySelectorAll(s)];
  const view = () => d.getElementById('view');
  const nav = () => $('.bottomnav');
  const frame = () => new Promise(r => w.requestAnimationFrame(() => r()));
  const settle = async () => { await frame(); await frame(); };
  const css = (el, p) => w.getComputedStyle(el)[p];
  const ready = () => view().children.length && view().getAttribute('aria-busy') !== 'true';
  async function go(hash, sel) {
    w.location.hash = hash;
    await until(() => w.location.hash === hash && ready() && (!sel || $(sel)));
    await settle();
  }
  await until(ready);
  // An iPhone's notch and home bar: the top bars grow by the inset, as they do on the phone.
  de.style.setProperty('--safe-t', '47px'); de.style.setProperty('--safe-b', '34px');
  await settle();
  // Sheets the app opens only with a GitHub connection (step notes, new playlist) use these.
  // Imported inside the frame's realm, so it's the module instance the app itself uses.
  const ui = await new w.Function('u', 'return import(u)')(new URL('js/ui.js', w.location.href).href);

  /* ---- phone behaviour the headless browser doesn't have ---- */
  // The visible area (visualViewport): the keyboard shortens it; iOS's drift moves it off the layout viewport.
  function screen({ height, offsetTop } = {}) {
    for (const [k, v] of Object.entries({ height, offsetTop })) {
      if (v == null) delete vvp[k]; else Object.defineProperty(vvp, k, { configurable: true, get: () => v });
    }
    vvp.dispatchEvent(new Event('resize'));
  }
  const KB = 300;
  async function keyboardUp(el) { el.focus(); screen({ height: de.clientHeight - KB }); await settle(); }
  async function keyboardDown(el) { el?.blur(); screen(); await settle(); }
  async function type(el, text) {
    await keyboardUp(el);
    el.value = text;
    el.dispatchEvent(new w.Event('input', { bubbles: true }));
    await settle();
  }
  function tap(el) {
    const r = el.getBoundingClientRect();
    const o = { bubbles: true, cancelable: true, composed: true, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, pointerType: 'touch', isPrimary: true };
    el.dispatchEvent(new w.PointerEvent('pointerdown', o));
    el.dispatchEvent(new w.PointerEvent('pointerup', o));
    el.click();
  }
  const esc = () => d.dispatchEvent(new w.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
  const topSheet = () => $$('.sheet-backdrop.open').pop();
  async function sheetOpened(name) {
    const okd = await until(() => topSheet() && de.classList.contains('sheet-open'), 2000);
    check(`${name} opens`, okd, 'no open sheet');
    await settle();
    return topSheet();
  }
  async function sheetsGone() { await until(() => !$('.sheet-backdrop'), 1500); await settle(); }

  /* ---- what may never happen ---- */
  // iOS zooms the page when a field under 16px gets focus, and doesn't zoom back out.
  function auditFields(where) {
    const bad = $$('input, select, textarea').filter(el =>
      !/^(checkbox|radio|file|range|hidden|button|submit|reset|color)$/.test(el.type) && el.getClientRects().length
      && css(el, 'visibility') !== 'hidden' && parseFloat(css(el, 'fontSize')) < 15.9);
    check('every form field is ≥ 16px, so focusing it never zooms the page on iOS', !bad.length,
      `${where}: ${bad.map(el => `${el.tagName.toLowerCase()}.${el.className || el.id} ${css(el, 'fontSize')}`).join(', ')}`);
  }
  function navOnEdge(where) {
    const n = nav(), r = n.getBoundingClientRect();
    const bottom = vvp.offsetTop + vvp.height;
    check('the bottom nav sits on the screen’s bottom edge', Math.abs(r.bottom - bottom) < 1.5, `${where}: nav bottom ${r.bottom}, screen bottom ${bottom}`);
    // (A drifted screen extends below this frame, where nothing can be hit-tested.)
    const y = r.bottom - 10, hit = y < de.clientHeight ? d.elementFromPoint(r.left + r.width / 2, y) : n;
    check('the bottom nav is visible and tappable', css(n, 'visibility') === 'visible' && css(n, 'display') !== 'none' && !n.inert
      && n.contains(hit), `${where}: visibility ${css(n, 'visibility')}, inert ${n.inert}, hit ${hit?.className}`);
  }
  let baseNodes = 0;
  async function nothingLingers(where) {
    await sheetsGone();
    const cls = ['sheet-open', 'kb-open', 'vv-drift'].filter(c => de.classList.contains(c));
    check('no scroll-lock / keyboard / drift class is left on <html>', !cls.length, `${where}: ${cls}`);
    const vars = ['--vv-dy', '--vv-top', '--vv-h'].filter(v => de.style.getPropertyValue(v));
    check('no viewport correction is left on <html>', !vars.length, `${where}: ${vars}`);
    check('the page scrolls (no leftover overflow lock)', css(d.body, 'overflow') !== 'hidden' && css(de, 'overflow') !== 'hidden', `${where}`);
    const inert = $$('body > *').filter(el => el.inert).map(el => el.id || el.className);
    check('nothing in the page is left inert', !inert.length, `${where}: ${inert}`);
    check('no orphan sheet or bubble is left', !$('.sheet-backdrop') && !$('.rx-ingtip'), `${where}: ${$$('.sheet-backdrop, .rx-ingtip').length}`);
    check('one viewport probe at most', $$('.vv-probe').length <= 1, `${where}: ${$$('.vv-probe').length}`);
    const tf = [de, d.body].filter(el => css(el, 'transform') !== 'none' || css(el, 'filter') !== 'none' || css(el, 'zoom') !== '1');
    check('<html> and <body> carry no transform/filter (it would unpin every fixed bar)', !tf.length, `${where}: ${tf.map(e => e.tagName)}`);
    navOnEdge(where);
  }

  /* An ingredient / temperature bubble: tapped, it shows inside the visible screen, on top of every bar;
     tapped again, it closes. */
  async function bubble(btn, where, { covered = true } = {}) {
    const what = btn.dataset.temp ? 'temperature' : 'ingredient';
    tap(btn); await settle();
    const tip = d.getElementById('rx-ingtip');
    if (!check(`a tapped ${what} shows its bubble — ${where}`, tip && btn.getAttribute('aria-expanded') === 'true', `no bubble (word at y=${Math.round(btn.getBoundingClientRect().top)})`)) return;
    const r = tip.getBoundingClientRect();
    const v = { top: vvp.offsetTop, bottom: vvp.offsetTop + vvp.height, left: vvp.offsetLeft, right: vvp.offsetLeft + vvp.width };
    check(`…inside the visible screen — ${where}`, r.top >= v.top - 1 && r.bottom <= v.bottom + 1 && r.left >= v.left - 1 && r.right <= v.right + 1,
      `bubble ${Math.round(r.top)}–${Math.round(r.bottom)}, screen ${v.top}–${v.bottom}`);
    if (covered) {
      const hit = d.elementFromPoint(r.left + r.width / 2, r.top + 3);    // its top edge: where a header would cover it
      check(`…and not hidden behind a bar — ${where}`, tip.contains(hit), `covered by ${hit?.closest('[class]')?.className}`);
    }
    tap(btn); await settle();
    check('tapping the word again closes its bubble', !d.getElementById('rx-ingtip'), where);
  }
  /** Scroll the page so `el`'s top sits at `y` on screen (as far as the page can scroll). */
  async function scrollTo(el, y) {
    w.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + w.scrollY - y));
    await settle();
  }

  for (round = 1; round <= ROUNDS; round++) {
    /* ---------- Recipes: search, sort, filters, the ⋯ editor ---------- */
    if (round > 1) await go('#/', '.search-input');
    auditFields('recipes list');
    const search = $('.search-input');
    await type(search, 'chi');
    check('keyboard up: the bottom nav steps aside', de.classList.contains('kb-open') && css(nav(), 'visibility') === 'hidden', 'recipes search');
    await keyboardDown(search);
    search.value = ''; search.dispatchEvent(new w.Event('input', { bubbles: true }));
    const sort = $('.sort-select');
    if (sort) {
      sort.focus();
      sort.value = sort.options[(sort.selectedIndex + 1) % sort.options.length].value;
      sort.dispatchEvent(new w.Event('change', { bubbles: true }));
      sort.blur(); await settle();
    }
    tap($('[data-act="filters"]'));
    if (await sheetOpened('the filter sheet')) { auditFields('filter sheet'); esc(); }
    await sheetsGone();
    const more = $('[data-act="more"]');
    if (more) {
      tap(more);
      const s = await sheetOpened('the ⋯ editor');
      const tag = s?.querySelector('input:not([type="checkbox"])');
      if (s) auditFields('⋯ editor');
      if (tag) await keyboardUp(tag);
      // A tap outside closes it while the keyboard is still up.
      if (s) s.dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
      await sheetsGone();
      await keyboardDown(d.activeElement);
    }
    await nothingLingers('recipes list');

    /* ---------- a recipe: bubbles at the top and bottom of the screen, a timer, a note ---------- */
    await go(`#/r/${SLUG}`, '.rx-ingref');
    auditFields('recipe page');
    const topbarH = $('.topbar').getBoundingClientRect().bottom;
    const refs = $$('.rx-step [data-ingref]');
    await scrollTo(refs[0], topbarH + 6);
    await bubble(refs[0], 'recipe page, word just under the top bar');
    const low = refs[refs.length - 1];
    await scrollTo(low, nav().getBoundingClientRect().top - 40);
    await bubble(low, 'recipe page, word just above the bottom nav');
    const temp = $('.rx-step [data-temp], .rx-tip [data-temp]');
    if (temp) { await scrollTo(temp, 300); await bubble(temp, 'recipe page, mid-screen'); }
    // A bubble left open closes when you leave the page.
    tap(refs[1] || refs[0]); await settle();
    const timerBtn = $('[data-act="timer"]');
    if (timerBtn && round === 1) { tap(timerBtn); await settle(); }
    const noteOpen = $('[data-act="note-open"]');
    if (noteOpen) {
      tap(noteOpen); await settle();
      const ta = $('textarea[data-composer]');
      if (ta) { auditFields('note composer'); await type(ta, `round ${round}`); await keyboardDown(ta); }
    }

    /* The iOS drift: after the keyboard or an app switch, the screen (visual viewport) sits below the
       layout viewport the fixed bars are pinned to. */
    const D = 160;
    screen({ offsetTop: D }); w.dispatchEvent(new Event('scroll')); await settle();
    navOnEdge('drifted by 160px');
    // A word in the bottom 160px of the screen: below the layout viewport, but on screen.
    const deep = $$('.rx-step [data-ingref]').pop();   // (the composer may have repainted the steps)
    await scrollTo(deep, de.clientHeight + D / 2);
    check('(setup) a word sits in the drifted strip', deep.getBoundingClientRect().top > de.clientHeight, `word at ${deep.getBoundingClientRect().top}`);
    await bubble(deep, 'drifted screen, word near its bottom', { covered: false });
    screen(); w.dispatchEvent(new Event('scroll')); await settle();
    check('drift over → the correction is gone', !de.classList.contains('vv-drift'), de.style.getPropertyValue('--vv-dy'));
    // iOS catching up without firing any event: a correction left on would now lift the nav itself.
    screen({ offsetTop: D }); w.dispatchEvent(new Event('scroll')); await settle();
    delete vvp.offsetTop;
    await until(() => !de.classList.contains('vv-drift'), 1200);
    check('a drift that ends silently (no event) loses its correction within a second', !de.classList.contains('vv-drift'), de.style.getPropertyValue('--vv-dy'));
    navOnEdge('after a silent catch-up');

    /* ---------- cook mode ---------- */
    await go(`#/r/${SLUG}/cook`, '.ck-text');
    check('leaving a page closes its open bubble', !$('.rx-ingtip'), 'recipe → cook');
    w.scrollTo(0, 0); await settle();
    const first = $('.ck-text [data-ingref], .ck-text [data-temp]');
    if (first) await bubble(first, 'cook mode, first line under its sticky header');
    tap($('[data-act="next"]')); await settle();
    tap($('[data-act="prev"]')); await settle();
    // On to a step with a temperature: its bubble is the tallest (°C, oven dial, fan, convection).
    for (let k = 0; k < 12 && !$('.ck-text [data-temp]') && $('[data-act="next"]'); k++) { tap($('[data-act="next"]')); await settle(); }
    const ct = $('.ck-text [data-temp]');
    check('(setup) cook mode reaches a step with a temperature', ct, 'none');
    if (ct) {
      await scrollTo(ct, $('.ck-top').getBoundingClientRect().bottom + 6);
      await bubble(ct, 'cook mode, temperature right under its sticky header');
    }
    tap($('[data-act="ingredients"]'));
    const ing = await sheetOpened('cook mode’s Ingredients sheet');
    if (ing) { auditFields('cook ingredients sheet'); tap(ing.querySelector('.sheet-actions .btn')); }
    await sheetsGone();
    // A note sheet (the real one needs a GitHub connection): typed into, then dismissed with the keyboard up.
    ui.promptSheet('Note on this step', { multiline: true });
    const ns = await sheetOpened('a note sheet in cook mode');
    const nta = ns?.querySelector('textarea');
    if (nta) { auditFields('note sheet'); await type(nta, 'x'); }
    esc(); await sheetsGone(); await keyboardDown(d.activeElement);
    // The app goes to the background mid-cook and comes back.
    Object.defineProperty(d, 'hidden', { configurable: true, get: () => true });
    d.dispatchEvent(new Event('visibilitychange'));
    delete d.hidden;
    d.dispatchEvent(new Event('visibilitychange')); w.dispatchEvent(new w.PageTransitionEvent('pageshow', { persisted: true }));
    await settle();
    check('cook mode leaves no sheet lock behind', !de.classList.contains('sheet-open') && !$$('body > *').some(el => el.inert), 'cook');
    await go(`#/r/${SLUG}`, '.rx-ingref');
    await nothingLingers('back from cook mode');

    /* ---------- playlists: a prompt sheet with the keyboard up ---------- */
    await go('#/playlists', '[data-act="new"]');
    ui.promptSheet('New playlist', { placeholder: 'Name' });
    const ps = await sheetOpened('a prompt sheet on Playlists');
    const pin = ps?.querySelector('.input');
    if (pin) { auditFields('new-playlist prompt'); await type(pin, 'Tmp'); }
    esc(); await sheetsGone(); await keyboardDown(d.activeElement);
    await nothingLingers('playlists');

    /* ---------- upload form: every field, keyboard up and down ---------- */
    await go('#/add/upload', '#up-title');
    auditFields('upload form');
    for (const sel of ['#up-url', '#up-caption', '#up-title', '#up-hint']) {
      const el = $(sel);
      if (el && el.getClientRects().length) { await type(el, el.value || 'x'); await keyboardDown(el); }
    }
    await nothingLingers('upload form');
    await go('#/add/custom', '.ed');
    auditFields('custom recipe form');

    /* ---------- converter and settings ---------- */
    await go('#/convert', '.cv-amt');
    auditFields('converter');
    const amt = $('.cv-amt');
    await type(amt, '250'); await keyboardDown(amt);
    await nothingLingers('converter');
    await go('#/settings');
    auditFields('settings');
    await nothingLingers('settings');

    await go('#/', '.search-input');
    await nothingLingers(`end of round ${round}`);
    const nodes = d.getElementsByTagName('*').length;
    if (round === 1) baseNodes = nodes;
    else check('the page doesn’t grow round after round', nodes <= baseNodes + 40, `${baseNodes} → ${nodes} elements`);
  }

  round = 'end';
  check('double-tap zoom is off (touch-action: manipulation), so quick taps never zoom the page',
    css(de, 'touchAction') === 'manipulation', css(de, 'touchAction'));

  for (const [name, c] of checks) ok(`${name}${c.n > 1 ? ` (×${c.n})` : ''}`, !c.fail, c.fail || '');
  w.localStorage.clear(); w.sessionStorage.clear();
} catch (e) {
  ok('suite threw', false, String(e?.stack || e));
}

const failed = results.filter(r => !r.ok).length;
document.getElementById('view').innerHTML = `<p class="t-sum ${failed ? 'bad' : 'good'}">${failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`}</p>
<table>${results.map(r => `<tr class="${r.ok ? 'pass' : 'fail'}"><td>${r.ok ? 'ok' : 'FAIL'}</td><td>${r.name.replace(/</g, '&lt;')}${r.detail ? `<br><span class="muted">${String(r.detail).replace(/</g, '&lt;')}</span>` : ''}</td></tr>`).join('')}</table>`;
document.getElementById('frames').remove();
fetch('/__smoke/release');
</script>
</body>
</html>
