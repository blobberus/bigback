name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true   # phone edits can land in bursts; only the newest matters

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp the service worker with a hash of the app files
        # Code changes → new VERSION → phones install a fresh, consistent cache and reload once.
        # Data-only commits (ratings, notes) leave the hash, and so sw.js, unchanged.
        # The shell is cache-first, so a code change that doesn't move VERSION would never reach
        # phones: hash everything sw.js precaches, and fail the deploy if the stamp didn't land.
        run: |
          H=$(cat index.html manifest.webmanifest css/*.css $(find js -name '*.js' | sort) $(find assets -type f | sort) | sha256sum | cut -c1-10)
          sed -i "s/^const VERSION = '[^']*';/const VERSION = '$H';/" sw.js
          grep -n "^const VERSION" sw.js
          grep -q "^const VERSION = '$H';" sw.js || { echo "::error::sw.js VERSION was not stamped"; exit 1; }
      - name: Validate data (report only)
        run: python scripts/validate.py
        continue-on-error: true
      - name: Rebuild index (deployed copy is always in sync)
        run: python scripts/build_index.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
