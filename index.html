<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bigback">
  <meta name="description" content="Personal recipe vault">
  <title>Bigback — Recipe Vault</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/library.css">
  <link rel="stylesheet" href="css/recipe.css">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/tools.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#view">Skip to content</a>
  <header class="topbar">
    <a id="topbar-back" class="icon-btn" href="#/" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 id="topbar-title">Bigback</h1>
    <div id="topbar-actions"></div>
  </header>

  <div class="offline-banner" role="status">Offline — showing saved copies</div>

  <main id="view" tabindex="-1"></main>

  <!-- Global kitchen tools mount here (timers tray, stopwatch). -->
  <div id="tools"></div>
  <div id="toasts" aria-live="polite"></div>

  <nav class="bottomnav" aria-label="Main">
    <a href="#/" data-nav="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Recipes</span>
    </a>
    <a href="#/playlists" data-nav="playlists">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h11M4 11h11M4 16h7"/><circle cx="18" cy="16" r="2.5"/><path d="M20.5 16V5"/></svg><span>Playlists</span>
    </a>
    <a href="#/add" data-nav="add" class="nav-add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add</span>
    </a>
    <a href="#/settings" data-nav="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>Settings</span>
    </a>
  </nav>
  <noscript>This app needs JavaScript.</noscript>
</body>
</html>
